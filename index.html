<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-40">
    <div class="max-w-md mx-auto p-4">
        <div id="listScreen">
            <header class="mb-6 text-center"><h1 class="text-3xl font-extrabold text-gray-800">UTA-ARCHIVE</h1></header>
            <div id="songList" class="space-y-3">読み込み中...</div>
            <div id="pagination" class="mt-6 flex justify-center gap-2"></div>
        </div>

        <div id="playerScreen" class="hidden">
            <button onclick="showList()" class="mb-4 text-blue-600 font-bold">&larr; リストに戻る</button>
            <div id="playerContent" class="bg-white p-8 rounded-3xl shadow-lg text-center"></div>
        </div>

        <div id="miniPlayer" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-2xl z-50 rounded-t-3xl">
            <p id="miniTitle" class="text-sm font-bold mb-4 truncate text-center"></p>
            <div class="flex justify-center items-center gap-6 text-2xl">
                <button onclick="skip(-1)">⏮</button>
                <button onclick="togglePlay()" id="mainPlayBtn" class="bg-blue-600 text-white w-16 h-16 rounded-full shadow-lg flex items-center justify-center">▶</button>
                <button onclick="skip(1)">⏭</button>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [], currentIndex = 0, currentPage = 1;
        const ITEMS_PER_PAGE = 20;
        let audioPlayer = new Audio();

        document.addEventListener('DOMContentLoaded', async () => {
            const baseUrl = window.location.href.split('/').slice(0, -1).join('/');
            try {
                const response = await fetch(`${baseUrl}/data.json`);
                const data = await response.json();
                // 最新の生成年月日順にソート
                allSongs = data.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
                renderList();
            } catch (e) { document.getElementById('songList').innerHTML = 'データ取得エラー'; }
        });

        function renderList() {
            const list = document.getElementById('songList');
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageSongs = allSongs.slice(start, start + ITEMS_PER_PAGE);
            
            list.innerHTML = '';
            pageSongs.forEach((song, i) => {
                const globalIndex = start + i;
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4';
                div.innerHTML = `
                    <button onclick="event.stopPropagation(); loadAndPlay(${globalIndex})" class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full font-bold">▶</button>
                    <div class="flex-grow cursor-pointer" onclick="showDetail(${globalIndex})">
                        <h2 class="font-bold text-gray-800">${song.title} ${song.is_retake ? '<span class="text-[10px] text-red-500 font-bold">(RE-TAKE)</span>' : ''}</h2>
                        <p class="text-xs text-gray-500">${song.artist} | ${song.last_updated}</p>
                    </div>
                `;
                list.appendChild(div);
            });
            renderPagination();
        }

        function renderPagination() {
            const p = document.getElementById('pagination');
            p.innerHTML = `<button onclick="changePage(-1)" class="px-3 py-1 bg-gray-200 rounded">前へ</button>
                           <span class="px-3 py-1">${currentPage}</span>
                           <button onclick="changePage(1)" class="px-3 py-1 bg-gray-200 rounded">次へ</button>`;
        }

        function changePage(dir) {
            currentPage = Math.max(1, Math.min(currentPage + dir, Math.ceil(allSongs.length / ITEMS_PER_PAGE)));
            renderList();
        }

        function showDetail(index) {
            const song = allSongs[index];
            document.getElementById('playerContent').innerHTML = `
                <h2 class="text-2xl font-bold mb-2">${song.title}</h2>
                <p class="text-lg text-gray-600">${song.artist}</p>
                <p class="text-sm text-gray-400 mt-4">更新日: ${song.last_updated}</p>
                <button onclick="loadAndPlay(${index})" class="mt-6 w-full py-4 bg-blue-600 text-white rounded-xl font-bold">この曲を再生する</button>
            `;
            document.getElementById('listScreen').classList.add('hidden');
            document.getElementById('playerScreen').classList.remove('hidden');
        }

        function loadAndPlay(index) {
            currentIndex = index;
            audioPlayer.src = allSongs[index].url;
            audioPlayer.play().catch(e => console.log("再生待機"));
            document.getElementById('miniPlayer').classList.remove('hidden');
            document.getElementById('miniTitle').innerText = allSongs[index].title;
            document.getElementById('mainPlayBtn').innerText = '⏸';
        }

        function togglePlay() {
            audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
            document.getElementById('mainPlayBtn').innerText = audioPlayer.paused ? '▶' : '⏸';
        }

        function skip(dir) {
            currentIndex = (currentIndex + dir + allSongs.length) % allSongs.length;
            loadAndPlay(currentIndex);
        }

        function showList() {
            document.getElementById('playerScreen').classList.add('hidden');
            document.getElementById('listScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
