                                </div>
                                <p className="text-sm text-neutral-400 truncate font-bold">
                                  {song.artist} <span className="opacity-30">•</span> {song.version}
                                </p>
                              </div>
                            </div>

                            {/* 右側：最高音階バッジのみ */}
                            <div className="flex items-center gap-3 flex-shrink-0 ml-2">
                              <div className="text-xs font-mono font-black px-2.5 py-1.5 bg-rose-950/40 text-rose-300 rounded-lg border border-rose-900/30">
                                {song.highestChest || '未設定'}
                              </div>

                              {/* 編集 */}
                              <button 
                                onClick={(e) => {
                                  e.stopPropagation();
                                  openEditModal(song);
                                }}
                                className="p-2 text-neutral-400 hover:text-white"
                              >
                                <SvgIcon name="edit3" className="w-5 h-5" />
                              </button>
                            </div>

                          </div>
                        );
                      })
                    ) : (
                      <div className="text-center py-20 text-neutral-600">
                        <SvgIcon name="music" className="w-14 h-14 mx-auto mb-2 opacity-25" />
                        <p className="text-base font-bold">対象の楽曲はありません</p>
                      </div>
                    )}
                  </div>
                  
                </div>

                {/* TAB 3: INPUT_DATA (同期 ＆ 新規手動登録 ＆ キャッシュ環境設定 ＆ 全削除) */}
                <div className={`absolute inset-0 p-4 overflow-y-auto smooth-scroll bg-neutral-950 space-y-5 transition-transform duration-300 ${
                  activeTab === 'input_data' ? 'translate-x-0' : 'translate-x-full pointer-events-none'
                }`}>
                  
                  {/* 新設：1. クラウドベースURL・共有リストURL自動スキャン設定 */}
                  <div className="bg-neutral-900/50 p-4 rounded-2xl border border-neutral-900 space-y-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                      <SvgIcon name="settings" className="w-5 h-5 text-rose-500" />
                      クラウド共有フォルダ自動同期の設定
                    </h3>
                    <p className="text-xs text-neutral-400 leading-relaxed">
                      GitHub Pages等のクラウド上のWAV/MP3フォルダアドレス、および楽曲一覧テキスト（`songs_list.txt`）の直リンクURLを登録します。起動時に自動的に最新の楽曲リストを同期監視します。
                    </p>

                    <div className="space-y-3">
                      <div>
                        <label className="text-[11px] text-neutral-400 font-bold block mb-1">① クラウド配信ベースURL（実音源フォルダ）</label>
                        <input 
                          type="url" 
                          value={settings.cloudBaseUrl}
                          onChange={(e) => updateAppSetting('cloudBaseUrl', e.target.value)}
                          placeholder="https://raw.githubusercontent.com/[ユーザー名]/[リポジトリ]/main/songs/" 
                          className="w-full p-2.5 bg-neutral-950 border border-neutral-850 rounded-xl text-xs text-white focus:outline-none focus:border-rose-500 font-mono"
                        />
                      </div>

                      <div>
                        <label className="text-[11px] text-neutral-400 font-bold block mb-1">② 共有リストURL（自動監視用のテキストファイル）</label>
                        <input 
                          type="url" 
                          value={settings.cloudListUrl}
                          onChange={(e) => updateAppSetting('cloudListUrl', e.target.value)}
                          placeholder="https://[ユーザー名].github.io/[リポジトリ]/songs_list.txt" 
                          className="w-full p-2.5 bg-neutral-950 border border-neutral-850 rounded-xl text-xs text-white focus:outline-none focus:border-rose-500 font-mono"
                        />
                      </div>
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button 
                        onClick={handleManualCloudListSync}
                        className="flex-1 flex items-center justify-center gap-1.5 py-2.5 bg-rose-600 hover:bg-rose-500 text-neutral-950 rounded-xl text-xs font-black transition-colors"
                      >
                        <SvgIcon name="refreshCw" className="w-4 h-4" />
                        <span>今すぐクラウドリストから同期</span>
                      </button>
                    </div>

                    <div className="flex items-center justify-between pt-2.5 border-t border-neutral-850/40">
                      <div className="min-w-0 pr-2">
                        <span className="text-xs font-bold text-neutral-300 block">音源のブラウザ永続キャッシュ</span>
                        <span className="text-[10px] text-neutral-500">※iPhoneの容量が不足している場合はOFF（ストリーミング再生）を強く推奨します。</span>
                      </div>
                      <label className="relative inline-flex items-center cursor-pointer flex-shrink-0">
                        <input 
                          type="checkbox" 
                          checked={settings.autoLocalCache}
                          onChange={(e) => updateAppSetting('autoLocalCache', e.target.checked)}
                          className="sr-only peer"
                        />
                        <div className="w-9 h-5 bg-neutral-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-neutral-400 after:border-neutral-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-rose-600"></div>
                      </label>
                    </div>
                  </div>

                  {/* 2. 実音源の同期 (複数選択マウント ＆ ブラウザキャッシュ) */}
                  <div className="bg-neutral-900/50 p-4 rounded-2xl border border-neutral-900 space-y-2.5">
                    <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                      <SvgIcon name="folderOpen" className="text-cyan-400" />
                      音源ファイルの同期 ＆ ブラウザ永続化
                    </h3>
                    <p className="text-xs text-neutral-400 leading-relaxed">
                      iCloud/OneDrive/Google Drive等のWAVやMP3ファイルを複数指定してアプリに取り込みます。実音源はブラウザのセーフデータベースにキャッシュ保存されます。
                    </p>

                    <div className="space-y-2">
                      <label className="w-full flex items-center justify-center gap-2 px-4 py-3.5 bg-gradient-to-r from-rose-500 to-pink-600 text-neutral-950 font-black rounded-xl cursor-pointer hover:opacity-95 active:scale-98 transition-all text-sm shadow-lg shadow-rose-500/5">
                        {isSyncing ? (
                          <>
                            <SvgIcon name="refreshCw" className="w-5 h-5 animate-spin" />
                            <span>同期 ＆ キャッシュ中...</span>
                          </>
                        ) : (
                          <>
                            <SvgIcon name="fileAudio" className="w-5 h-5" />
                            <span>音源を選択して同期保存する</span>
                          </>
                        )}
                        <input 
                          type="file" 
                          multiple 
                          accept=".wav,.mp3"
                          onChange={handleMultipleFilesSelect}
                          className="hidden" 
                          disabled={isSyncing}
                        />
                      </label>

                      <button
                        onClick={handleClearAllCaches}
                        className="w-full py-2.5 bg-neutral-950 text-rose-400 hover:text-rose-300 font-bold rounded-xl text-xs transition-colors border border-rose-950/40"
                      >
                        すべての音声キャッシュ（Blobデータ）を全削除
                      </button>
                    </div>
                  </div>

                  {/* 3. テキスト一括流し込み登録パネル */}
                  <div className="bg-neutral-900/50 p-4 rounded-2xl border border-neutral-900 space-y-3">
                    <div className="space-y-1">
                      <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                        <SvgIcon name="listMusic" className="text-rose-400" />
                        ファイル名リストから曲を一括登録
                      </h3>
                      <p className="text-xs text-neutral-400 leading-relaxed">
                        お手持ちの300曲のファイル名一覧を改行区切りで貼り付けるだけで、一度にデータベースにインポートされます。
                      </p>
                    </div>

                    <textarea
                      value={bulkText}
                      onChange={(e) => setBulkText(e.target.value)}
                      rows={4}
                      placeholder="例:&#13;アーティスト名_曲名_バージョン&#13;Ado_新時代_OriginalKey&#13;米津玄師_Lemon_Key-2"
                      className="w-full p-2.5 bg-neutral-950 border border-neutral-850 rounded-xl text-xs text-white focus:outline-none focus:border-rose-500 font-mono leading-relaxed font-bold"
                    />

                    <button
                      onClick={handleBulkTextImport}
                      className="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-100 font-black rounded-xl text-xs transition-colors border border-neutral-700"
                    >
                      一括リスト登録を実行
                    </button>
                  </div>

                  {/* 4. 1曲手動登録 */}
                  <div className="bg-neutral-900/50 p-4 rounded-2xl border border-neutral-900 space-y-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                      <SvgIcon name="plus" className="text-amber-400" />
                      1曲ずつ手動で新規登録
                    </h3>

                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        value={singleManual.title}
                        onChange={(e) => setSingleManual({ ...singleManual, title: e.target.value })}
                        placeholder="曲名 (必須)"
                        className="p-2.5 bg-neutral-950 border border-neutral-850 rounded-xl text-xs text-white focus:outline-none focus:border-rose-500 font-bold"
                      />
                      <input
                        type="text"
                        value={singleManual.artist}
                        onChange={(e) => setSingleManual({ ...singleManual, artist: e.target.value })}
                        placeholder="アーティスト名"
                        className="p-2.5 bg-neutral-950 border border-neutral-850 rounded-xl text-xs text-white focus:outline-none focus:border-rose-500 font-bold"
                      />
                    </div>
                    <input
                      type="text"
                      value={singleManual.version}
                      onChange={(e) => setSingleManual({ ...singleManual, version: e.target.value })}
                      placeholder="バージョン (例: OriginalKey, +2key など)"
                      className="w-full p-2.5 bg-neutral-950 border border-neutral-850 rounded-xl text-xs text-white focus:outline-none focus:border-rose-500 font-bold"
                    />

                    <button
                      onClick={handleSingleManualAdd}
                      className="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-100 font-black rounded-xl text-xs transition-colors border border-neutral-700"
                    >
                      手動登録を確定
                    </button>
                  </div>

                  {/* 5. データベースのインポート＆エクスポート */}
                  <div className="bg-neutral-900/50 p-4 rounded-2xl border border-neutral-900 space-y-3.5">
                    <div>
                      <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                        <SvgIcon name="database" className="text-purple-400" />
                        歌唱メモデータベースのバックアップ
                      </h3>
                      <p className="text-xs text-neutral-400">
                        最高音や自己評価メモ（JSON）のみを軽量エクスポート、またはインポートして復元できます。
                      </p>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <button 
                        onClick={exportDatabase}
                        className="flex items-center justify-center gap-1.5 py-2.5 bg-neutral-800 hover:bg-neutral-755 rounded-xl text-xs font-bold text-white transition-colors border border-neutral-700"
                      >
                        <SvgIcon name="download" className="w-4 h-4 text-rose-500" />
                        <span>エクスポート</span>
                      </button>
                      <label className="flex items-center justify-center gap-1.5 py-2.5 bg-neutral-800 hover:bg-neutral-755 rounded-xl text-xs font-bold text-white cursor-pointer transition-colors border border-neutral-700">
                        <SvgIcon name="upload" className="w-4 h-4 text-cyan-400" />
                        <span>インポート</span>
                        <input type="file" accept=".json" onChange={importDatabase} className="hidden" />
                      </label>
                    </div>
                  </div>

                  {/* ==========================================
                      【新設】6. データベースの完全初期化セクション
                      ========================================== */}
                  <div className="bg-red-950/15 p-4 rounded-2xl border-2 border-red-900/40 space-y-3">
                    <div>
                      <h3 className="text-sm font-bold text-red-400 flex items-center gap-1.5">
                        <SvgIcon name="trash" className="text-red-500 w-5 h-5" />
                        【危険】登録したすべての楽曲リストを完全消去
                      </h3>
                      <p className="text-[11px] text-neutral-400 leading-relaxed mt-1">
                        現在アプリ内に登録されているすべての楽曲リスト、最高地声音、お気に入り、作成したプレイリストを完全に一括消去して初期デモ曲のみの状態に戻します。
                      </p>
                    </div>
                    
                    <button
                      onClick={() => setIsDeleteConfirmOpen(true)}
                      className="w-full py-3 bg-red-600/90 hover:bg-red-600 text-neutral-950 font-black rounded-xl text-xs transition-colors shadow-lg shadow-red-900/20"
                    >
                      すべての登録楽曲・歌唱メモを完全に削除する
                    </button>
                  </div>

                </div>

              </main>

              {/* ==========================================
                  最下部：常駐型ミニプレーヤー ＆ クイック再生
                  ========================================== */}
              <div className="flex-shrink-0 border-t border-neutral-900 bg-neutral-950 p-3.5 space-y-3.5 z-40">
                
                {/* リアルタイム波形 ＆ シークキャンバス */}
                <div className="relative">
                  {isDecodingWaveform ? (
                    <div className="w-full h-14 bg-neutral-900/50 rounded-xl flex items-center justify-center text-xs text-rose-400 gap-2 border border-neutral-900">
                      <SvgIcon name="refreshCw" className="w-5 h-5 animate-spin text-rose-500" />
                      <span className="font-mono text-xs font-bold tracking-wider">波形デコード中...</span>
                    </div>
                  ) : (
                    <canvas 
                      ref={canvasRef}
                      width={480}
                      height={56}
                      onClick={handleWaveformClick}
                      className="w-full h-14 bg-neutral-900 rounded-xl cursor-pointer hover:border-neutral-800 transition-all border border-neutral-900/60"
                    />
                  )}
                  <div className="absolute bottom-1 right-2 bg-neutral-950/90 px-1.5 py-0.5 rounded text-[10px] text-neutral-400 font-mono font-bold">
                    {formatTime(currentTime)} / {formatTime(duration)}
                  </div>
                </div>

                {/* ミニプレイヤーコントロール */}
                <div className="flex items-center justify-between gap-3">
                  
                  {/* 現在の曲情報表示 */}
                  <div className="min-w-0 flex-1">
                    {currentSong ? (
                      <div onClick={() => setActiveTab('player')} className="cursor-pointer space-y-0.5">
                        <h4 className="text-base font-black text-white truncate leading-tight">{currentSong.title}</h4>
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs text-rose-400 font-black font-mono">{currentSong.highestChest || 'Key?'}</span>
                          <span className="text-xs text-neutral-400 font-extrabold truncate">{currentSong.artist}</span>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <h4 className="text-xs font-bold text-neutral-500">曲が停止中</h4>
                        <p className="text-[10px] text-neutral-600 font-bold">ライブラリから曲を選択</p>
                      </div>
                    )}
                  </div>

                  {/* プレイヤー中心ボタン */}
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <button 
                      onClick={() => setIsShuffle(!isShuffle)}
                      className={`p-2.5 rounded-lg active:scale-90 transition-all ${isShuffle ? 'text-rose-400 bg-rose-950/30' : 'text-neutral-500'}`}
                    >
                      <SvgIcon name="shuffle" className="w-5 h-5" />
                    </button>
                    
                    <button onClick={handlePrev} className="p-3 text-neutral-400 active:scale-90 transition-all">
                      <SvgIcon name="skipBack" className="w-5 h-5" />
                    </button>
                    
                    <button 
                      onClick={togglePlay} 
                      className={`p-4 rounded-full active:scale-95 transition-all shadow-xl flex items-center justify-center ${
                        isPlaying 
                          ? 'bg-neutral-700 text-white shadow-neutral-900/30' 
                          : 'bg-emerald-500 text-white shadow-emerald-500/20'
                      }`}
                    >
                      {isPlaying ? (
                        <SvgIcon name="pause" className="w-6 h-6" />
                      ) : (
                        <SvgIcon name="play" className="w-6 h-6 ml-0.5" />
                      )}
                    </button>
                    
                    <button onClick={handleNext} className="p-3 text-neutral-400 active:scale-90 transition-all">
                      <SvgIcon name="skipForward" className="w-5 h-5" />
                    </button>

                    <button 
                      onClick={() => setIsLooping(!isLooping)}
                      className={`p-2.5 rounded-lg active:scale-90 transition-all ${isLooping ? 'text-rose-400 bg-rose-950/30' : 'text-neutral-500'}`}
                    >
                      <SvgIcon name="repeat" className="w-5 h-5" />
                    </button>
                  </div>

                </div>

              </div>

              {/* ==========================================
                  未同期ファイルマウント補填モーダル
                  ========================================== */}
              {unresolvedSong && (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
                  <div className="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl p-5">
                    <div className="text-center space-y-4">
                      
                      <CharacterMascot className="w-24 h-24 mx-auto animate-pulse" mood="angry" />
                      
                      <div className="space-y-1">
                        <h3 className="font-extrabold text-white text-base">音声ファイルを同期させてください</h3>
                        <p className="text-[12px] text-neutral-400 leading-relaxed">
                          「{unresolvedSong.title}」を再生するための音源ファイルが見つかりません。
                        </p>
                      </div>

                      <div className="p-3 bg-neutral-950 rounded-xl text-[11px] text-neutral-400 font-mono break-all text-left border border-neutral-900/80 leading-normal">
                        期待するファイル名:<br/>
                        <span className="text-rose-400 font-bold">{unresolvedSong.filename}</span>
                      </div>

                      <div className="space-y-2 pt-2">
                        {!settings.cloudBaseUrl && (
                          <p className="text-[11px] text-rose-300 leading-relaxed bg-rose-950/30 p-2.5 rounded-xl border border-rose-900/30 font-bold">
                            ※「登録 / 同期」タブからクラウド配信ベースURLを設定しておくと、この画面を出さずに自動フェッチ再生が可能です。
                          </p>
                        )}

                        <label className="w-full flex items-center justify-center gap-1.5 py-3.5 bg-rose-500 text-neutral-950 text-sm font-black rounded-xl cursor-pointer hover:opacity-90 active:scale-95 transition-all">
                          <SvgIcon name="fileAudio" className="w-5 h-5" />
                          <span>ローカルからファイルを選んで紐づける</span>
                          <input 
                            type="file" 
                            accept=".wav,.mp3"
                            onChange={handleResolveSongFile}
                            className="hidden" 
                          />
                        </label>

                        <button 
                          onClick={() => setUnresolvedSong(null)}
                          className="w-full py-2.5 bg-neutral-800 text-neutral-400 hover:text-white rounded-xl text-xs font-bold transition-all"
                        >
                          閉じる
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ==========================================
                  歌唱データ個別編集モーダル (文字拡大版)
                  ========================================== */}
              {isEditModalOpen && editingSong && (
                <div className="fixed inset-0 bg-black/95 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
                  <div className="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-in fade-in zoom-in-95 duration-100">
                    <div className="p-4 bg-neutral-950 border-b border-neutral-850 flex items-center justify-between">
                      <h3 className="font-bold text-sm text-rose-400 flex items-center gap-1.5">
                        <SvgIcon name="edit3" className="w-5 h-5" /> 歌唱記録アップデート
                      </h3>
                      <button onClick={() => setIsEditModalOpen(false)} className="text-neutral-400 p-1">
                        <SvgIcon name="x" className="w-5 h-5" />
                      </button>
                    </div>
                    
                    <div className="p-4 space-y-4 max-h-[60vh] overflow-y-auto smooth-scroll">
                      
                      <div className="grid grid-cols-2 gap-2.5">
                        <div>
                          <label className="text-[12px] text-neutral-400 font-black block mb-1">曲名</label>
                          <input 
                            type="text" 
                            value={editingSong.title}
                            onChange={(e) => setEditingSong({ ...editingSong, title: e.target.value })}
                            className="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-sm text-white focus:outline-none focus:border-rose-500 font-bold"
                          />
                        </div>
                        <div>
                          <label className="text-[12px] text-neutral-400 font-black block mb-1">アーティスト名</label>
                          <input 
                            type="text" 
                            value={editingSong.artist}
                            onChange={(e) => setEditingSong({ ...editingSong, artist: e.target.value })}
                            className="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-sm text-white focus:outline-none focus:border-rose-500 font-bold"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2.5">
                        <div>
                          <label className="text-[12px] text-neutral-400 font-black block mb-1">バージョン</label>
                          <input 
                            type="text" 
                            value={editingSong.version}
                            onChange={(e) => setEditingSong({ ...editingSong, version: e.target.value })}
                            className="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-sm text-white focus:outline-none focus:border-rose-500 font-bold"
                          />
                        </div>
                        <div>
                          <label className="text-[12px] text-rose-400 font-black block mb-1">地声最高音</label>
                          <input 
                            type="text" 
                            value={editingSong.highestChest}
                            onChange={(e) => setEditingSong({ ...editingSong, highestChest: e.target.value })}
                            className="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-sm text-rose-400 focus:outline-none focus:border-rose-500 font-black font-mono text-center"
                            placeholder="hiA"
                          />
                        </div>
                      </div>

                      {/* 音源キャッシュコントロール */}
                      {fileMap.has(editingSong.filename) && (
                        <div className="p-3 bg-emerald-950/20 border border-emerald-900/40 rounded-xl flex items-center justify-between">
                          <div className="min-w-0">
                            <span className="text-[11px] text-emerald-400 font-black block">ローカルキャッシュ</span>
                            <span className="text-[10px] text-neutral-400 font-bold">実ファイルは IndexedDB に保存されています。</span>
                          </div>
                          <button 
                            type="button"
                            onClick={(e) => handleClearSongCache(editingSong, e)}
                            className="px-2.5 py-1.5 bg-neutral-950 hover:bg-rose-950/20 border border-neutral-850 text-rose-400 rounded-lg text-[10px] font-bold flex-shrink-0"
                          >
                            クリア
                          </button>
                        </div>
                      )}

                      <div>
                        <label className="text-[12px] text-neutral-400 font-black block mb-1">自己評価・お気に入り度</label>
                        <div className="flex gap-2 bg-neutral-950 p-2 rounded-xl border border-neutral-850 justify-center">
                          {[1, 2, 3, 4, 5].map((val) => (
                            <button 
                              key={val} 
                              type="button"
                              onClick={() => setEditingSong({ ...editingSong, rating: val })}
                              className="p-1 transition-transform active:scale-135"
                            >
                              <SvgIcon name="star" className={`w-6 h-6 ${val <= editingSong.rating ? 'fill-amber-500 text-amber-500' : 'text-neutral-700'}`} />
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="text-[12px] text-neutral-400 font-black block mb-1">プレイリスト設定</label>
                        <div className="flex flex-wrap gap-1.5">
                          {playlists.map(pl => {
                            const hasSong = pl.songFilenames.includes(editingSong.filename);
                            return (
                              <button
                                key={pl.id}
                                type="button"
                                onClick={() => toggleSongInPlaylist(pl.id, editingSong.filename)}
                                className="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 border transition-all bg-neutral-950 text-neutral-500 border-neutral-850"
                              >
                                {pl.name}
                                {hasSong && <SvgIcon name="check" className="w-3 h-3" />}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div>
                        <label className="text-[12px] text-neutral-400 font-black block mb-1">歌唱コメント・練習メモ</label>
                        <textarea 
                          value={editingSong.comments || ''}
                          onChange={(e) => setEditingSong({ ...editingSong, comments: e.target.value })}
                          rows={3}
                          className="w-full p-2.5 bg-neutral-950 border border-neutral-850 rounded-xl text-sm text-white focus:outline-none focus:border-rose-500 resize-none leading-relaxed font-semibold"
                          placeholder="最高音の出しやすさやキー設定のメモなど..."
                        />
                      </div>

                    </div>

                    <div className="p-3 bg-neutral-950 border-t border-neutral-850 flex justify-end gap-2.5 text-xs">
                      <button 
                        onClick={() => setIsEditModalOpen(false)}
                        className="px-4 py-2 bg-neutral-800 text-neutral-400 rounded-xl font-bold"
                      >
                        閉じる
                      </button>
                      <button 
                        onClick={saveSongMetadata}
                        className="px-4 py-2 bg-rose-500 text-neutral-950 rounded-xl font-black shadow-md shadow-rose-500/10"
                      >
                        保存する
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* プレイリスト新規作成モーダル */}
              {isPlaylistModalOpen && (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-xs overflow-hidden shadow-2xl">
                    <div className="p-3.5 bg-neutral-950 border-b border-neutral-850">
                      <h3 className="font-bold text-xs text-rose-400 flex items-center gap-1">
                        <SvgIcon name="plus" className="w-3.5 h-3.5" /> プレイリストの新規作成
                      </h3>
                    </div>
                    <div className="p-4">
                      <input 
                        type="text" 
                        value={newPlaylistName}
                        onChange={(e) => setNewPlaylistName(e.target.value)}
                        placeholder="プレイリスト名を入力..." 
                        className="w-full p-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-sm text-white focus:outline-none focus:border-rose-500 font-bold"
                      />
                    </div>
                    <div className="p-3 bg-neutral-950 flex justify-end gap-1.5 border-t border-neutral-850 text-xs">
                      <button 
                        onClick={() => setIsPlaylistModalOpen(false)}
                        className="px-3.5 py-2 bg-neutral-850 text-neutral-400 rounded-xl font-bold"
                      >
                        キャンセル
                      </button>
                      <button 
                        onClick={handleCreatePlaylist}
                        className="px-3.5 py-2 bg-rose-500 text-neutral-950 rounded-xl font-black"
                      >
                        作成する
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* ヘルプモーダル */}
              {isInfoModalOpen && (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                    <div className="p-4 bg-neutral-950 border-b border-neutral-850 flex items-center justify-between">
                      <h3 className="font-bold text-sm text-rose-400 flex items-center gap-1.5">
                        <SvgIcon name="info" className="w-4.5 h-4.5" /> 歌唱アーカイブの使い方
                      </h3>
                      <button onClick={() => setIsInfoModalOpen(false)} className="text-neutral-400">
                        <SvgIcon name="x" className="w-5 h-5" />
                      </button>
                    </div>
                    
                    <div className="p-4 space-y-3 max-h-[60vh] overflow-y-auto smooth-scroll text-xs leading-relaxed text-neutral-300">
                      <div>
                        <h4 className="font-bold text-white mb-0.5">1. 実音源のブラウザ永続キャッシュについて</h4>
                        <p className="text-[11px] text-neutral-400 leading-normal">
                          ブラウザの仕様により、通常のBlob URLはリロードで消失します。当アプリではこの問題を解決するため、<strong>同期した音楽ファイルをIndexedDB内に永続保存</strong>します。これでリロード後も完全にファイル紐づけが維持されます！
                        </p>
                      </div>

                      <div>
                        <h4 className="font-bold text-white mb-0.5">2. クラウド自動取得（自動ダウンロード）</h4>
                        <p className="text-[11px] text-neutral-400 leading-normal">
                          「登録 / 同期 / 設定」タブから「クラウド配信ベースURL」を登録します。GitHubやサーバーに楽曲ファイルをアップロードしておき、ベースURLを設定するだけで、アプリが<strong>クラウドから楽曲を自動でダウンロード＆キャッシュ化</strong>して再生するようになります。
                        </p>
                      </div>

                      <div>
                        <h4 className="font-bold text-white mb-0.5">3. 曲の一括流し込み登録</h4>
                        <p className="text-[11px] text-neutral-400 leading-normal">
                          「アーティスト名_曲名_バージョン」のように記述した改行区切りのテキストを貼り付けることで、手元に実音源がなくてもまず300曲一括で歌唱データベースを生成可能です。
                        </p>
                      </div>

                      <div>
                        <h4 className="font-bold text-white mb-0.5">4. 本物の波形（PCMデコーダー）</h4>
                        <p className="text-[11px] text-neutral-400">
                          再生する1曲のみをリアルタイムにバックグラウンドでデコードします。メモリやCPUへの負荷を最小限に抑えながら、美しい音量ダイナミクス波形を描画します。
                        </p>
                      </div>
                    </div>

                    <div className="p-3 bg-neutral-950 border-t border-neutral-850 text-center">
                      <button 
                        onClick={() => setIsInfoModalOpen(false)}
                        className="px-5 py-2 bg-rose-500 text-neutral-950 rounded-xl text-xs font-black transition-all"
                      >
                        閉じる
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* ==========================================
                  【新規追加】楽曲全削除・データベース初期化の確認用カスタムモーダル
                  ※alert / confirmを使用せず、安全に閉じることができる独自PWA仕様です。
                  ========================================== */}
              {isDeleteConfirmOpen && (
                <div className="fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center z-50 p-4 animate-in fade-in duration-150">
                  <div className="bg-neutral-900 border-2 border-red-500/50 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl p-6 space-y-4">
                    <div className="text-center space-y-3">
                      
                      <div className="mx-auto w-16 h-16 bg-red-950/40 text-red-500 rounded-full flex items-center justify-center border border-red-800">
                        <SvgIcon name="trash" className="w-8 h-8" />
                      </div>
                      
                      <div className="space-y-1.5">
                        <h3 className="font-black text-red-400 text-base">本当にリストを完全削除しますか？</h3>
                        <p className="text-xs text-neutral-300 leading-relaxed font-bold">
                          この操作は取り消せません。あなたが登録した全楽曲の登録データ、メモ、お気に入り、および同期済みの全音声キャッシュがすべて消去され、アプリは最初の「デモ曲のみ」の状態に戻ります。
                        </p>
                      </div>

                      <div className="space-y-2 pt-4">
                        <button 
                          onClick={handleAbsoluteClearDatabase}
                          className="w-full py-3 bg-red-600 text-neutral-950 text-sm font-black rounded-xl active:scale-95 transition-all shadow-lg shadow-red-900/40"
                        >
                          完全に初期化してデモ曲に戻す
                        </button>

                        <button 
                          onClick={() => setIsDeleteConfirmOpen(false)}
                          className="w-full py-3 bg-neutral-800 text-neutral-300 hover:text-white rounded-xl text-xs font-bold transition-all"
                        >
                          削除をやめて戻る
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
