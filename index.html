<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .waveform-canvas { width: 100%; height: 60px; cursor: pointer; }
        .play-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-40">
    <div class="max-w-md mx-auto p-4">
        <div id="listScreen">
            <header class="mb-6 text-center"><h1 class="text-3xl font-extrabold text-gray-800">UTA-ARCHIVE</h1></header>
            <div id="songList" class="space-y-3"></div>
        </div>

        <div id="playerScreen" class="hidden">
            <button onclick="showList()" class="mb-4 text-blue-600 font-bold">&larr; リストに戻る</button>
            <div id="playerContent" class="bg-white p-8 rounded-3xl shadow-lg text-center"></div>
        </div>

        <!-- 固定ミニプレイヤー（高機能版） -->
        <div id="miniPlayer" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-2xl z-50 rounded-t-3xl">
            <p id="miniTitle" class="text-sm font-bold mb-2 truncate text-center"></p>
            <canvas id="waveform" class="waveform-canvas mb-3 bg-gray-100 rounded"></canvas>
            <div class="flex justify-center items-center gap-4 text-2xl">
                <button onclick="changeMode()" id="modeBtn" class="text-sm text-gray-400">順次</button>
                <button onclick="skip(-1)">⏮</button>
                <button onclick="togglePlay()" id="mainPlayBtn" class="bg-blue-600 text-white w-16 h-16 rounded-full text-2xl shadow-lg flex items-center justify-center">▶</button>
                <button onclick="skip(1)">⏭</button>
                <button onclick="toggleShuffle()" id="shuffleBtn" class="text-sm text-gray-400">順序</button>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [], currentIndex = 0, isShuffle = false, repeatMode = 0; // 0:なし, 1:全曲, 2:1曲
        let audioPlayer = new Audio(), audioCtx, analyser, dataArray;

        document.addEventListener('DOMContentLoaded', async () => {
            const baseUrl = window.location.href.split('/').slice(0, -1).join('/');
            try {
                const response = await fetch(`${baseUrl}/data.json`);
                allSongs = await response.json();
                renderList();
            } catch (e) { document.getElementById('songList').innerHTML = 'データ読み込みエラー'; }

            audioPlayer.onended = () => handleNext();
        });

        function renderList() {
            const list = document.getElementById('songList');
            allSongs.forEach((song, i) => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer';
                div.innerHTML = `<h2 class="font-bold">${song.title}</h2><p class="text-xs text-gray-500">${song.artist}</p>`;
                div.onclick = () => loadAndPlay(i);
                list.appendChild(div);
            });
        }

        function loadAndPlay(index) {
            currentIndex = index;
            audioPlayer.src = allSongs[index].url;
            setupWebAudio();
            audioPlayer.play();
            document.getElementById('listScreen').classList.add('hidden');
            document.getElementById('playerScreen').classList.remove('hidden');
            document.getElementById('miniPlayer').classList.remove('hidden');
            document.getElementById('miniTitle').innerText = allSongs[index].title;
        }

        function setupWebAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(audioPlayer);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                drawWaveform();
            }
        }

        function drawWaveform() {
            const canvas = document.getElementById('waveform');
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2563eb';
            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                ctx.fillRect(i * 3, canvas.height - barHeight, 2, barHeight);
            }
            requestAnimationFrame(drawWaveform);
        }

        function togglePlay() {
            audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
            document.getElementById('mainPlayBtn').innerText = audioPlayer.paused ? '▶' : '⏸';
        }

        function skip(dir) {
            currentIndex = (currentIndex + dir + allSongs.length) % allSongs.length;
            loadAndPlay(currentIndex);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').innerText = isShuffle ? 'シャッフル' : '順序';
        }

        function handleNext() {
            if (isShuffle) skip(Math.floor(Math.random() * allSongs.length));
            else skip(1);
        }
    </script>
</body>
</html>
