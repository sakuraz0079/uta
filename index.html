<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-20"> <!-- ミニプレイヤー分の余白 -->
    <div class="max-w-md mx-auto p-4">
        
        <!-- 一覧画面 -->
        <div id="listScreen">
            <header class="mb-6 text-center">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">UTA-ARCHIVE</h1>
            </header>
            <div id="songList" class="space-y-3">
                <div class="text-center py-10 text-gray-400">読み込み中...</div>
            </div>
        </div>

        <!-- 再生詳細画面（初期は非表示） -->
        <div id="playerScreen" class="hidden">
            <button onclick="showList()" class="mb-4 text-blue-600 font-bold flex items-center">
                &larr; リストに戻る
            </button>
            <div id="playerContent" class="bg-white p-6 rounded-3xl shadow-lg text-center">
                <!-- JSで動的に挿入 -->
            </div>
        </div>

        <!-- 固定ミニプレイヤー（画面下部） -->
        <div id="miniPlayer" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-3 shadow-2xl flex items-center justify-between z-50">
            <div id="miniPlayerContent" class="flex-1 pr-4 overflow-hidden">
                <!-- 再生中タイトルが入ります -->
            </div>
            <button onclick="document.getElementById('playerScreen').classList.remove('hidden'); document.getElementById('listScreen').classList.add('hidden');" 
                    class="bg-blue-600 text-white px-3 py-1 rounded-lg text-sm font-bold">
                開く
            </button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
