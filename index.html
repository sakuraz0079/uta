<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-24">
    <div class="max-w-md mx-auto p-4">
        <nav class="flex gap-4 mb-6 text-sm font-bold text-gray-500 overflow-x-auto pb-2 border-b">
            <button onclick="showScreen('listScreen')" class="whitespace-nowrap text-blue-600">全楽曲</button>
            <button onclick="showPlaylist()" class="whitespace-nowrap">再生リスト</button>
        </nav>

        <div id="listScreen">
            <h1 class="text-2xl font-extrabold mb-4">全楽曲</h1>
            <input type="text" id="searchInput" placeholder="曲名やアーティストで検索..." oninput="resetPageAndFilter()" class="w-full p-3 mb-4 border rounded-xl shadow-sm">
            <div id="songList" class="space-y-3">読み込み中...</div>
            <div id="moreContainer" class="mt-6 hidden">
                <button onclick="loadMore()" class="w-full py-3 bg-gray-200 text-gray-700 rounded-xl font-bold">さらに読み込む</button>
            </div>
        </div>

        <div id="playlistScreen" class="hidden">
            <h1 class="text-2xl font-extrabold mb-4">再生リスト</h1>
            <div id="playlistContainer" class="space-y-4"></div>
        </div>

        <div id="playerScreen" class="hidden">
            <button onclick="showScreen('listScreen')" class="mb-4 text-blue-600 font-bold">&larr; リストに戻る</button>
            <div id="playerContent" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100"></div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let filteredSongs = [];
        let displayCount = 20;
        let playlist = JSON.parse(localStorage.getItem('myPlaylist')) || [];
        const audioPlayer = new Audio();
        const API_URL = "https://script.google.com/macros/s/AKfycbzyZp7_HO5TsYlREel12IxcPXpEBL6zydkhe0jGFH_VDkvAlip22p0EpFUdpNLSQaWiWg/exec";

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                allSongs = await response.json();
                allSongs.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
                filteredSongs = allSongs;
                renderList();
            } catch (e) { document.getElementById('songList').innerText = "データ読み込み失敗"; }
        }

        function resetPageAndFilter() {
            displayCount = 20;
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            filteredSongs = allSongs.filter(s => 
                (s.title || "").toLowerCase().includes(keyword) || (s.artist || "").toLowerCase().includes(keyword)
            );
            renderList();
        }

        function loadMore() {
            displayCount += 20;
            renderList();
        }

        function renderList() {
            const container = document.getElementById('songList');
            const moreContainer = document.getElementById('moreContainer');
            const toDisplay = filteredSongs.slice(0, displayCount);
            
            container.innerHTML = toDisplay.map(s => {
                const count = parseInt(s.retake_count) || 0;
                const stars = s.quality_score ? '★'.repeat(Math.min(s.quality_score, 5)) : '';
                return `
                <div class="bg-white p-4 rounded-xl border flex items-center gap-4">
                    <div class="flex-shrink-0 w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center cursor-pointer" onclick="loadAndPlay('${s.url}', '${s.title}')">▶</div>
                    <div class="flex-grow cursor-pointer" onclick="showDetail('${s.id}')">
                        <div class="flex items-center gap-2">
                            <h2 class="font-bold text-sm truncate">${s.title}</h2>
                            ${count > 0 ? `<span class="text-[10px] bg-red-100 text-red-600 px-1 rounded font-bold">RE:${count}</span>` : ''}
                        </div>
                        <p class="text-[10px] text-gray-500">${s.artist}</p>
                        <div class="text-[10px] text-yellow-500">${stars}</div>
                    </div>
                    <button onclick="addToPlaylist('${s.id}')" class="text-xl text-gray-400 hover:text-blue-600">+</button>
                </div>
            `}).join('');
            
            moreContainer.classList.toggle('hidden', displayCount >= filteredSongs.length);
        }

        function loadAndPlay(url, title) {
            audioPlayer.src = url;
            audioPlayer.play();
            alert(title + ' を再生します');
        }

        function showDetail(id) {
            const s = allSongs.find(song => song.id == id);
            const count = parseInt(s.retake_count) || 0;
            const stars = s.quality_score ? '★'.repeat(Math.min(s.quality_score, 5)) : '';
            const date = new Date(s.last_updated);
            const formattedDate = !isNaN(date) ? `${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getDate().toString().padStart(2,'0')}` : "";
            
            document.getElementById('playerContent').innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-extrabold mb-1">${s.title}</h2>
                    <p class="text-lg text-gray-600">${s.artist}</p>
                    <div class="text-yellow-500 text-2xl my-2">${stars}</div>
                    <button onclick="loadAndPlay('${s.url}', '${s.title}')" class="w-full mt-4 py-4 bg-blue-600 text-white rounded-xl font-bold text-lg shadow-lg">再生ボタン ▶</button>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl mb-4 space-y-3">
                    <div class="grid grid-cols-2 gap-4">
                        <div><p class="text-[10px] text-gray-400 font-bold">最高音</p><p class="font-bold">${s.highest_note || '-'}</p></div>
                        <div><p class="text-[10px] text-gray-400 font-bold">キー</p><p class="font-bold">${s.key || '-'}</p></div>
                    </div>
                    <p class="text-xs text-gray-400">歌いなおし回数: ${count > 0 ? count + '回' : 'なし'}</p>
                    <p class="text-xs text-gray-400">最終更新日: ${formattedDate}</p>
                    <p class="text-sm border-t pt-2 mt-2">${s.memo || 'メモなし'}</p>
                </div>
                <button onclick="addToPlaylist('${s.id}')" class="w-full py-3 bg-gray-800 text-white rounded-xl font-bold">再生リストに追加</button>
            `;
            showScreen('playerScreen');
        }

        function showPlaylist() {
            showScreen('playlistScreen');
            const container = document.getElementById('playlistContainer');
            const latest = allSongs.slice(0, 20);
            container.innerHTML = `
                <h2 class="font-bold text-gray-700">最新20曲</h2>
                <div class="space-y-1">${latest.map(s => `<p class="text-sm border-b pb-1">${s.title}</p>`).join('')}</div>
                <h2 class="font-bold text-gray-700 mt-6">手動追加リスト</h2>
                <div class="space-y-2">${playlist.map(id => {
                    const s = allSongs.find(x => x.id == id);
                    return s ? `<div class="flex justify-between text-sm bg-white p-2 rounded border"><span>${s.title}</span><button onclick="removeFromPlaylist('${id}')" class="text-red-400">×</button></div>` : '';
                }).join('')}</div>
            `;
        }

        function addToPlaylist(id) {
            if (!playlist.includes(id)) {
                playlist.push(id);
                localStorage.setItem('myPlaylist', JSON.stringify(playlist));
                alert('リストに追加しました');
            }
        }

        function removeFromPlaylist(id) {
            playlist = playlist.filter(x => x !== id);
            localStorage.setItem('myPlaylist', JSON.stringify(playlist));
            showPlaylist();
        }

        function showScreen(id) {
            ['listScreen', 'playlistScreen', 'playerScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        loadData();
    </script>
</body>
</html>
