<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>#progressBar { transition: width 0.1s linear; }</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-40">
    <div class="max-w-md mx-auto p-4">
        <!-- 一覧画面 -->
        <div id="listScreen">
            <header class="mb-6 text-center"><h1 class="text-3xl font-extrabold text-gray-800">UTA-ARCHIVE</h1></header>
            <div id="songList" class="space-y-3"></div>
        </div>

        <!-- 再生詳細画面 -->
        <div id="playerScreen" class="hidden">
            <button onclick="showList()" class="mb-4 text-blue-600 font-bold">&larr; リストに戻る</button>
            <div id="playerContent" class="bg-white p-8 rounded-3xl shadow-lg text-center"></div>
        </div>

        <!-- 固定ミニプレイヤー -->
        <div id="miniPlayer" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-6 shadow-2xl z-50 rounded-t-3xl text-center">
            <p id="miniTitle" class="text-lg font-bold mb-4 truncate"></p>
            <div class="h-2 w-full bg-gray-200 rounded-full mb-6">
                <div id="progressBar" class="h-full bg-blue-600 rounded-full w-0"></div>
            </div>
            <!-- ボタンが確実に描画されるようにインラインスタイルなどで調整 -->
            <button id="mainPlayBtn" onclick="togglePlay()" class="play-btn bg-blue-600 text-white w-20 h-20 rounded-full text-3xl shadow-xl flex items-center justify-center mx-auto">▶</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
