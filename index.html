    <!-- Reactコード of HTML (Babelでトランスパイル) -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // 音高順序テーブル（地声最高音の類似検索で使用）
        const PITCH_ORDER = [
          'mid1a', 'mid1a#', 'mid1b', 'mid1c', 'mid1c#', 'mid1d', 'mid1d#', 'mid1e', 'mid1f', 'mid1f#', 'mid1g', 'mid1g#',
          'mid2a', 'mid2a#', 'mid2b', 'mid2c', 'mid2c#', 'mid2d', 'mid2d#', 'mid2e', 'mid2f', 'mid2f#', 'mid2g', 'mid2g#',
          'hia', 'hia#', 'hib', 'hic', 'hic#', 'hid', 'hid#', 'hie', 'hif', 'hif#', 'hig', 'hig#',
          'hihia', 'hihia#', 'hihib', 'hihic'
        ];

        // ==========================================
        // 軽量かつ完全ポータブルな SVGアイコンコンポーネント (サイズ規格修正版)
        // 外部クラスでサイズ指定がない場合でも巨大化を恒久的に防ぐ安全フォールバック仕様
        // ==========================================
        const SvgIcon = ({ name, className = "" }) => {
          // サイズ指定クラスが含まれているか検知し、なければデフォルトで w-6 h-6 を自動付与
          const hasWidth = className.includes('w-');
          const hasHeight = className.includes('h-');
          const finalClassName = `${hasWidth ? '' : 'w-6'} ${hasHeight ? '' : 'h-6'} ${className}`.trim();

          const icons = {
            play: <path d="m6 3 14 9-14 9V3z" fill="currentColor" />,
            pause: <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor" />,
            skipForward: <path d="M5 4l10 8-10 8V4zM19 5v14h-2V5h2z" fill="currentColor" />,
            skipBack: <path d="M19 20L9 12l10-8v16zM5 19V5h2v14H5z" fill="currentColor" />,
            search: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></g>,
            folderOpen: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" /><path d="M2 10h20" /></g>,
            music: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></g>,
            listMusic: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15V6M18 8h3M14 6H3M14 12H3M14 18H3" /><circle cx="15" cy="18" r="3" /></g>,
            settings: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></g>,
            star: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></g>,
            edit3: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></g>,
            plus: <g stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></g>,
            x: <g stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></g>,
            download: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" /></g>,
            upload: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" /></g>,
            info: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></g>,
            volume2: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" /></g>,
            volumeX: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></g>,
            repeat: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9" /><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23 3 19 7 15" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /></g>,
            shuffle: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 3 21 3 21 8M4 20l14-14M21 16v5h-5M4 4l5 5M12 12l9 9" /></g>,
            check: <g stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></g>,
            refreshCw: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></g>,
            fileAudio: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="M9 15.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" /><path d="M10.5 14V10.5a1.5 1.5 0 0 1 1.5-1.5h1" /></g>,
            database: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" /></g>,
            trash: <g stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></g>
          };
          return (
            <svg className={finalClassName} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              {icons[name] || null}
            </svg>
          );
        };

        // ==========================================
        // キャラクター画像コンポーネント
        // ==========================================
        const CharacterMascot = ({ className = "w-32 h-32", mood = "idle", isPlaying = false }) => {
          const [imageError, setImageError] = useState(false);

          const getImagePath = () => {
            switch (mood) {
              case 'playing':
              case 'loving':
                return './011.png';
              case 'angry':
              case 'error':
                return './012.png';
              case 'cool':
              case 'sunglasses':
                return './031.png';
              case 'happy':
              case 'success':
                return './006.png';
              case 'idle':
              default:
                return './005.png';
            }
          };

          const getMoodTitle = () => {
            switch (mood) {
              case 'playing': return '再生中！ノリノリ';
              case 'angry': return 'ファイル未同期';
              case 'cool': return 'ドヤ顔うたねこ';
              case 'happy': return 'セーブ大成功！';
              default: return 'うたねこ待機中';
            }
          };

          if (imageError) {
            return (
              <div className={`relative flex flex-col items-center justify-center ${className} transition-all duration-300`}>
                <svg className={`w-full h-full ${isPlaying ? 'animate-bounce scale-105' : ''}`} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="100" cy="100" r="80" fill="url(#fallbackGlow)" opacity="0.15" />
                  <path d="M40 100 C40 50, 160 50, 160 100" stroke="#f43f5e" strokeWidth="8" strokeLinecap="round" />
                  <path d="M50 70 L30 30 L70 50 Z" fill="#1e1b4b" stroke="#f43f5e" strokeWidth="4" />
                  <path d="M150 70 L170 30 L130 50 Z" fill="#1e1b4b" stroke="#f43f5e" strokeWidth="4" />
                  <circle cx="100" cy="105" r="55" fill="#0f172a" stroke="#f43f5e" strokeWidth="4" />
                  {mood === 'playing' ? (
                    <>
                      <path d="M70 105 Q80 95 90 105" stroke="#f43f5e" strokeWidth="5" strokeLinecap="round" fill="none" />
                      <path d="M110 105 Q120 95 130 105" stroke="#f43f5e" strokeWidth="5" strokeLinecap="round" fill="none" />
                      <path d="M92 120 Q100 135 108 120 Z" fill="#f43f5e" stroke="#fff" strokeWidth="1.5" />
                    </>
                  ) : mood === 'angry' ? (
                    <>
                      <path d="M65 108 L85 98" stroke="#f43f5e" strokeWidth="4" strokeLinecap="round" />
                      <path d="M115 98 L135 108" stroke="#f43f5e" strokeWidth="4" strokeLinecap="round" />
                      <path d="M90 125 Q100 115 110 125" stroke="#f43f5e" strokeWidth="4" strokeLinecap="round" fill="none" />
                    </>
                  ) : (
                    <>
                      <circle cx="80" cy="105" r="7" fill="#f43f5e" />
                      <circle cx="120" cy="105" r="7" fill="#f43f5e" />
                      <path d="M92 120 Q96 124 100 120 Q104 124 108 120" stroke="#f43f5e" strokeWidth="3" fill="none" />
                    </>
                  )}
                  <defs>
                    <radialGradient id="fallbackGlow" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#f43f5e" />
                      <stop offset="100%" stopColor="#0f172a" stopOpacity="0" />
                    </radialGradient>
                  </defs>
                </svg>
              </div>
            );
          }

          return (
            <div className={`relative flex flex-col items-center justify-center select-none ${className}`}>
              <div className={`absolute inset-0 rounded-full transition-all duration-500 blur-xl opacity-35 ${
                isPlaying ? 'bg-rose-500/25 scale-125 animate-pulse' : 'bg-cyan-500/10'
              }`} />
              
              <img 
                src={getImagePath()} 
                alt={getMoodTitle()} 
                onError={() => setImageError(true)}
                className={`w-full h-full object-contain relative z-10 transition-transform duration-300 ${
                  isPlaying ? 'scale-105' : 'hover:-translate-y-0.5'
                }`}
              />
            </div>
          );
        };

        // ==========================================
        // IndexedDB 設定 (データのローカル永続化)
        // ==========================================
        const DB_NAME = 'VocalArchiveDB_v4'; 
        const STORE_SONGS = 'songs_metadata';
        const STORE_PLAYLISTS = 'playlists';
        const STORE_SETTINGS = 'app_settings'; 

        const initDB = () => {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 4);
            request.onupgradeneeded = (event) => {
              const db = event.target.result;
              if (!db.objectStoreNames.contains(STORE_SONGS)) {
                db.createObjectStore(STORE_SONGS, { keyPath: 'filename' });
              }
              if (!db.objectStoreNames.contains(STORE_PLAYLISTS)) {
                db.createObjectStore(STORE_PLAYLISTS, { keyPath: 'id' });
              }
              if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
                db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
              }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        };

        const saveToDB = async (storeName, data) => {
          try {
            const db = await initDB();
            return new Promise((resolve, reject) => {
              const transaction = db.transaction(storeName, 'readwrite');
              const store = transaction.objectStore(storeName);
              const request = store.put(data);
              request.onsuccess = () => resolve(true);
              request.onerror = () => reject(request.error);
            });
          } catch (error) {
            console.error('IndexedDB 保存エラー:', error);
          }
        };

        const getAllFromDB = async (storeName) => {
          try {
            const db = await initDB();
            return new Promise((resolve, reject) => {
              const transaction = db.transaction(storeName, 'readonly');
              const store = transaction.objectStore(storeName);
              const request = store.getAll();
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
          } catch (error) {
            console.error('IndexedDB 読み込みエラー:', error);
            return [];
          }
        };

        const getFromDB = async (storeName, key) => {
          try {
            const db = await initDB();
            return new Promise((resolve, reject) => {
              const transaction = db.transaction(storeName, 'readonly');
              const store = transaction.objectStore(storeName);
              const request = store.get(key);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
          } catch (error) {
            console.error('IndexedDB 取得エラー:', error);
            return null;
          }
        };

        const deleteFromDB = async (storeName, key) => {
          try {
            const db = await initDB();
            return new Promise((resolve, reject) => {
              const transaction = db.transaction(storeName, 'readwrite');
              const store = transaction.objectStore(storeName);
              const request = store.delete(key);
              request.onsuccess = () => resolve(true);
              request.onerror = () => reject(request.error);
            });
          } catch (error) {
            console.error('IndexedDB 削除エラー:', error);
          }
        };

        // ==========================================
        // メインアプリケーション
        // ==========================================
        function App() {
          const [songs, setSongs] = useState([]);
          const [fileMap, setFileMap] = useState(new Map()); 
          const [playlists, setPlaylists] = useState([]);
          const [currentPlaylist, setCurrentPlaylist] = useState('all'); 
          const [activeTab, setActiveTab] = useState('library');

          const [currentSong, setCurrentSong] = useState(null);
          const [loadedSong, setLoadedSong] = useState(null); // 現在実際にオーディオにロードされている楽曲ステート
          const [isPlaying, setIsPlaying] = useState(false);
          const [currentTime, setCurrentTime] = useState(0);
          const [duration, setDuration] = useState(0);
          const [volume, setVolume] = useState(0.8);
          const [isMuted, setIsMuted] = useState(false);
          const [isLooping, setIsLooping] = useState(false);
          const [isShuffle, setIsShuffle] = useState(false);

          const [mascotMood, setMascotMood] = useState('idle');

          const [searchQuery, setSearchQuery] = useState('');
          const [isEditModalOpen, setIsEditModalOpen] = useState(false);
          const [editingSong, setEditingSong] = useState(null);
          const [isPlaylistModalOpen, setIsPlaylistModalOpen] = useState(false);
          const [newPlaylistName, setNewPlaylistName] = useState('');
          const [isInfoModalOpen, setIsInfoModalOpen] = useState(false);
          
          // 【新設】全削除カスタム確認モーダル表示フラグ
          const [isDeleteConfirmOpen, setIsDeleteConfirmOpen] = useState(false);

          const [statusMessage, setStatusMessage] = useState({ text: '', type: 'info' });
          const [isSyncing, setIsSyncing] = useState(false);
          const [unresolvedSong, setUnresolvedSong] = useState(null);

          // アプリ設定情報ステート (ベースURL、ファイル自動永続化、リストURL)
          const [settings, setSettings] = useState({
            cloudBaseUrl: '', 
            cloudListUrl: '', // クラウド上の一覧リスト(songs_list.txt)のURL
            autoLocalCache: false // iPhone空き容量不足対策のためデフォルトを一時キャッシュ（完全ストリーミング）推奨に変更
          });

          // 手動データ入力用ステート
          const [bulkText, setBulkText] = useState('');
          const [singleManual, setSingleManual] = useState({ title: '', artist: '', version: '' });

          const canvasRef = useRef(null);
          const audioRef = useRef(null);
          const audioContextRef = useRef(null);
          const analyserRef = useRef(null);
          const animationFrameRef = useRef(null);
          const [isDecodingWaveform, setIsDecodingWaveform] = useState(false);
          const [waveformPeaks, setWaveformPeaks] = useState([]);

          const showStatus = (text, type = 'info') => {
            setStatusMessage({ text, type });
            setTimeout(() => {
              setStatusMessage({ text: '', type: 'info' });
            }, 3500);

            if (type === 'error') setMascotMood('angry');
            if (type === 'success') {
              setMascotMood('happy');
              setTimeout(() => setMascotMood(isPlaying ? 'playing' : 'idle'), 1800);
            }
          };

          // 初回ロード（IndexedDBからメタデータ・実音源キャッシュ・環境設定をロード）
          useEffect(() => {
            const loadSavedData = async () => {
              try {
                // 1. 設定情報の復元
                const savedSettings = await getAllFromDB(STORE_SETTINGS);
                const currentSettings = { ...settings };
                savedSettings.forEach(set => {
                  currentSettings[set.key] = set.value;
                });
                setSettings(currentSettings);

                // 2. 楽曲リスト情報の復元
                const savedSongs = await getAllFromDB(STORE_SONGS);
                const savedPlaylists = await getAllFromDB(STORE_PLAYLISTS);
                
                // メモリ上の音源Map（fileMap）をIndexedDBに永続化された実ファイルBlobから復元マウントする
                const restoredFileMap = new Map();
                if (savedSongs && savedSongs.length > 0) {
                  savedSongs.forEach(song => {
                    if (song.fileBlob) {
                      restoredFileMap.set(song.filename, song.fileBlob);
                    }
                  });
                  setFileMap(restoredFileMap);
                  setSongs(savedSongs);
                } else {
                  // お試しデモ曲
                  const demoSongs = [
                    {
                      filename: 'デモ_うたねこのテーマ_OriginalKey.mp3',
                      artist: 'うたねこ楽団',
                      title: 'うたねこのテーマ',
                      version: 'OriginalKey',
                      highestChest: 'hiB',
                      rating: 5,
                      comments: '歌唱アーカイブへようこそ！WAVファイルを上の「登録/同期」からマウントして再生できます。一度取り込んだ音源はリロードしても保持されます。',
                      dateAdded: new Date().toISOString(),
                      isDemo: true
                    }
                  ];
                  for (const s of demoSongs) {
                    await saveToDB(STORE_SONGS, s);
                  }
                  setSongs(demoSongs);
                }

                if (savedPlaylists && savedPlaylists.length > 0) {
                  setPlaylists(savedPlaylists);
                } else {
                  const initialPlaylists = [
                    { id: 'fav', name: 'お気に入り', songFilenames: [] },
                    { id: 'practice', name: 'カラオケ特訓中', songFilenames: [] }
                  ];
                  for (const pl of initialPlaylists) {
                    await saveToDB(STORE_PLAYLISTS, pl);
                  }
                  setPlaylists(initialPlaylists);
                }

                // 3. 【クラウド連携・起動時自動監視】もしクラウド共有リストのURLが登録されていれば自動取得を実行
                if (currentSettings.cloudListUrl) {
                  triggerCloudListSync(currentSettings.cloudListUrl, savedSongs);
                }

              } catch (err) {
                console.error("DBロードエラー:", err);
              }
            };
            loadSavedData();
          }, []);

          // キャラクター表情連動
          useEffect(() => {
            if (mascotMood === 'happy' || mascotMood === 'angry') return;
            
            if (isPlaying) {
              if (currentSong?.rating >= 4) {
                setMascotMood('cool');
              } else {
                setMascotMood('playing');
              }
            } else {
              if (unresolvedSong) {
                setMascotMood('angry');
              } else {
                setMascotMood('idle');
              }
            }
          }, [isPlaying, currentSong, unresolvedSong, mascotMood]);

          // ロックスクリーン(MediaSession API)への同期設定【スリープ時バックグラウンド対応】
          const updateMediaSession = (song) => {
            if ('mediaSession' in navigator && song) {
              navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: song.artist,
                album: song.version || 'UTA-ARCHIVE',
                artwork: [
                  { src: './005.png', sizes: '256x256', type: 'image/png' }
                ]
              });
              
              navigator.mediaSession.setActionHandler('play', () => togglePlay());
              navigator.mediaSession.setActionHandler('pause', () => togglePlay());
              navigator.mediaSession.setActionHandler('previoustrack', () => handlePrev());
              navigator.mediaSession.setActionHandler('nexttrack', () => handleNext());
            }
          };

          // PCMデコード (高速疑似エンベロープ生成後にバックグラウンドで遅延処理)
          const decodeAndGenerateWaveform = async (file) => {
            setIsDecodingWaveform(true);
            try {
              const AudioContextClass = window.AudioContext || window.webkitAudioContext;
              // 負荷を抑えるため最初の12秒だけをサンプリング
              const offlineCtx = new OfflineAudioContext(1, 44100 * 12, 44100); 
              const arrayBuffer = await file.slice(0, 1024 * 1024 * 3).arrayBuffer(); 
              
              offlineCtx.decodeAudioData(arrayBuffer, (audioBuffer) => {
                const channelData = audioBuffer.getChannelData(0);
                const numSamples = 100; 
                const blockSize = Math.floor(channelData.length / numSamples);
                const peaks = [];

                for (let i = 0; i < numSamples; i++) {
                  let max = 0;
                  for (let j = 0; j < blockSize; j++) {
                    const val = Math.abs(channelData[i * blockSize + j]);
                    if (val > max) max = val;
                  }
                  peaks.push(Math.max(0.08, Math.min(0.95, max * 1.6)));
                }

                setWaveformPeaks(peaks);
                setIsDecodingWaveform(false);
              }, (err) => {
                console.warn("PCMデコード失敗。簡易描画のまま継続します。");
                setIsDecodingWaveform(false);
              });
            } catch (e) {
              setIsDecodingWaveform(false);
            }
          };

          // 超高速疑似エンベロープ波形生成 (WAVロードをタップした瞬間 1ミリ秒で描画して見せる仕組み)
          const generateFallbackWaveform = (filename) => {
            let hash = 0;
            for (let i = 0; i < filename.length; i++) {
              hash = filename.charCodeAt(i) + ((hash << 5) - hash);
            }
            const peaks = [];
            for (let i = 0; i < 90; i++) {
              const sin1 = Math.sin((i / 90) * Math.PI * 6 + hash);
              const sin2 = Math.sin((i / 90) * Math.PI * 18 - hash);
              const envelope = Math.sin((i / 90) * Math.PI);
              peaks.push(Math.max(0.12, (Math.abs(sin1 * 0.6) + Math.abs(sin2 * 0.4)) * envelope + 0.1));
            }
            setWaveformPeaks(peaks);
          };

          // 音域自動解析 (正規表現を強化し、大文字・小文字、シャープやs表記を確実にキャッチする、??は徹底的に排除)
          const analyzeSongBackground = (song, audioBuffer = null) => {
            let updated = false;
            const tempSong = { ...song };

            // 1. ファイル名から「地声最高音」を抽出
            if (tempSong.highestChest === '未設定' || !tempSong.highestChest) {
              const pitchMatch = tempSong.filename.match(/(hihi[A-G]#?|hihi[A-G]s?|hi[A-G]#?|hi[A-G]s?|mid2[A-G]#?|mid2[A-G]s?|mid1[A-G]#?|mid1[A-G]s?)/i);
              if (pitchMatch) {
                let detected = pitchMatch[0].trim();
                
                // 表記を標準的な大文字・小文字表記にクリーンアップ整形
                detected = detected.replace(/hihi([a-g])/i, (_, g) => `hihi${g.toUpperCase()}`);
                detected = detected.replace(/hi([a-g])/i, (_, g) => `hi${g.toUpperCase()}`);
                detected = detected.replace(/mid2([a-g])/i, (_, g) => `mid2${g.toUpperCase()}`);
                detected = detected.replace(/mid1([a-g])/i, (_, g) => `mid1${g.toUpperCase()}`);
                detected = detected.replace(/s$/i, '#'); // s表記(シャープ)を#に変換
                
                tempSong.highestChest = detected;
                updated = true;
              }
            }

            // 2. バージョン(キー変更)情報の自動取得
            if (tempSong.version === '通常音源' || !tempSong.version) {
              const keyMatch = tempSong.filename.match(/([+-]\d+key|[+-]\d+|原キー|キー変更)/i);
              if (keyMatch) {
                tempSong.version = keyMatch[0];
                updated = true;
              }
            }

            if (updated) {
              saveToDB(STORE_SONGS, tempSong);
              // songsステートとcurrentSongステートに即座に同期・反映
              setSongs(prev => prev.map(s => s.filename === tempSong.filename ? { ...s, highestChest: tempSong.highestChest, version: tempSong.version } : s));
              if (currentSong && currentSong.filename === tempSong.filename) {
                setCurrentSong(prev => ({ ...prev, highestChest: tempSong.highestChest, version: tempSong.version }));
              }
            }
          };

          // 環境設定の変更＆保存
          const updateAppSetting = async (key, value) => {
            const updatedSettings = { ...settings, [key]: value };
            setSettings(updatedSettings);
            await saveToDB(STORE_SETTINGS, { key, value });
          };

          // クラウド共有リスト(songs_list.txt)の自動取得同期
          const triggerCloudListSync = async (targetUrl, currentLocalSongs = songs) => {
            if (!targetUrl) return;
            setIsSyncing(true);
            try {
              const response = await fetch(targetUrl + '?nocache=' + Date.now());
              if (!response.ok) throw new Error("クラウドの曲リストファイルのフェッチに失敗しました");
              
              const rawText = await response.text();
              const lines = rawText.split('\n');
              
              let newCount = 0;
              const localSongsMap = new Map(currentLocalSongs.map(s => [s.filename, s]));
              const updatedSongs = [...currentLocalSongs];

              lines.forEach(line => {
                let filename = line.trim();
                if (!filename) return;

                // WAV/MP3の拡張子がない場合は自動補填
                if (!filename.toLowerCase().endsWith('.wav') && !filename.toLowerCase().endsWith('.mp3')) {
                  filename += '.wav';
                }

                // ローカル側のIndexedDBにまだ登録されていない新曲のみマージ追加
                if (!localSongsMap.has(filename)) {
                  const cleanName = filename.substring(0, filename.lastIndexOf('.'));
                  const parts = cleanName.split('_');
                  
                  let artist = '不明なアーティスト';
                  let title = cleanName;
                  let version = '通常音源';

                  if (parts.length >= 2) {
                    artist = parts[0].trim();
                    title = parts[1].trim();
                    if (parts.length >= 3) {
                      version = parts.slice(2).join('_').trim();
                    }
                  }

                  const newSong = {
                    filename,
                    artist,
                    title,
                    version,
                    highestChest: '未設定', 
                    rating: 3, 
                    comments: '',
                    dateAdded: new Date().toISOString()
                  };

                  updatedSongs.push(newSong);
                  saveToDB(STORE_SONGS, newSong);
                  analyzeSongBackground(newSong);
                  newCount++;
                }
              });

              setSongs(updatedSongs);
              setIsSyncing(false);
              if (newCount > 0) {
                showStatus(`クラウドリストから新曲${newCount}曲を追加同期しました！`, 'success');
              } else {
                console.log("クラウドリスト同期完了 (新曲なし)");
              }
            } catch (err) {
              console.error("Cloud list sync failed:", err);
              setIsSyncing(false);
              showStatus("クラウド曲リストの自動更新に失敗しました", "error");
            }
          };

          // 手動でクラウド共有リストをフェッチ実行するボタン用
          const handleManualCloudListSync = () => {
            if (!settings.cloudListUrl) {
              showStatus("共有リストURLが登録されていません", "error");
              return;
            }
            triggerCloudListSync(settings.cloudListUrl, songs);
          };

          // スマホ用軽量ファイル同期 ＆ IndexedDB実ファイルキャッシュ
          const handleMultipleFilesSelect = async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            setIsSyncing(true);
            showStatus(`${files.length}曲のスキャン＆キャッシュ中...`, 'info');

            const newFileMap = new Map(fileMap);
            const existingSongsMap = new Map(songs.map(s => [s.filename, s]));
            const updatedSongs = [...songs];

            for (const file of files) {
              const filename = file.name;
              newFileMap.set(filename, file); 

              try {
                if (existingSongsMap.has(filename)) {
                  const existing = existingSongsMap.get(filename);
                  const updatedRecord = { ...existing };
                  if (settings.autoLocalCache) {
                    updatedRecord.fileBlob = file; 
                  }
                  await saveToDB(STORE_SONGS, updatedRecord);
                } else {
                  const cleanName = filename.substring(0, filename.lastIndexOf('.'));
                  const parts = cleanName.split('_');
                  
                  let artist = '不明なアーティスト';
                  let title = cleanName;
                  let version = '通常音源';

                  if (parts.length >= 2) {
                    artist = parts[0].trim();
                    title = parts[1].trim();
                    if (parts.length >= 3) {
                      version = parts.slice(2).join('_').trim();
                    }
                  }

                  const newSong = {
                    filename,
                    artist,
                    title,
                    version,
                    highestChest: '未設定', 
                    rating: 3, 
                    comments: '',
                    dateAdded: new Date().toISOString()
                  };

                  if (settings.autoLocalCache) {
                    newSong.fileBlob = file; 
                  }

                  updatedSongs.push(newSong);
                  await saveToDB(STORE_SONGS, newSong);
                  analyzeSongBackground(newSong);
                }
              } catch (storageError) {
                console.warn("DBキャッシュ容量制限のため、メモリ上にマウントします:", storageError);
              }
            }

            setFileMap(newFileMap);
            setSongs(updatedSongs);
            setIsSyncing(false);
            showStatus(`${files.length}曲の音源を同期しました！`, 'success');
            setActiveTab('library');
          };

          // 一括リスト流し込み登録
          const handleBulkTextImport = async () => {
            if (!bulkText.trim()) {
              showStatus('テキストが入力されていません', 'error');
              return;
            }

            const lines = bulkText.split('\n');
            let successCount = 0;
            const updatedSongs = [...songs];
            const existingSongsMap = new Map(songs.map(s => [s.filename, s]));

            for (const line of lines) {
              const cleanLine = line.trim();
              if (!cleanLine) continue;

              let filename = cleanLine;
              if (!filename.toLowerCase().endsWith('.wav') && !filename.toLowerCase().endsWith('.mp3')) {
                filename += '.wav';
              }

              if (!existingSongsMap.has(filename)) {
                const cleanName = filename.substring(0, filename.lastIndexOf('.'));
                const parts = cleanName.split('_');
                
                let artist = '不明なアーティスト';
                let title = cleanName;
                let version = '通常音源';

                if (parts.length >= 2) {
                  artist = parts[0].trim();
                  title = parts[1].trim();
                  if (parts.length >= 3) {
                    version = parts.slice(2).join('_').trim();
                  }
                }

                const newSong = {
                  filename,
                  artist,
                  title,
                  version,
                  highestChest: '未設定', 
                  rating: 3, 
                  comments: '',
                  dateAdded: new Date().toISOString()
                };

                updatedSongs.push(newSong);
                await saveToDB(STORE_SONGS, newSong);
                analyzeSongBackground(newSong);
                successCount++;
              }
            }

            if (successCount > 0) {
              setSongs(updatedSongs);
              setBulkText('');
              showStatus(`${successCount}曲を歌唱リストに新規登録しました！`, 'success');
              setActiveTab('library');
            } else {
              showStatus('入力された曲はすべて登録済みです', 'info');
            }
          };

          // 手動1曲追加
          const handleSingleManualAdd = async () => {
            if (!singleManual.title.trim()) {
              showStatus('曲名を入力してください', 'error');
              return;
            }

            const artist = singleManual.artist.trim() || '手動登録';
            const title = singleManual.title.trim();
            const version = singleManual.version.trim() || '通常音源';
            const filename = `${artist}_${title}_${version}.wav`;

            const existingSongsMap = new Map(songs.map(s => [s.filename, s]));
            if (existingSongsMap.has(filename)) {
              showStatus('同じ仕様 of 曲がすでに登録されています', 'error');
              return;
            }

            const newSong = {
              filename,
              artist,
              title,
              version,
              highestChest: '未設定', 
              rating: 3, 
              comments: '',
              dateAdded: new Date().toISOString()
            };

            const updated = [...songs, newSong];
            await saveToDB(STORE_SONGS, newSong);
            setSongs(updated);
            setSingleManual({ title: '', artist: '', version: '' });
            showStatus(`「${title}」を手動追加しました！`, 'success');
            setActiveTab('library');
          };

          // 最新15曲算出処理
          const latest15Songs = useMemo(() => {
            return [...songs]
              .filter(s => !s.isDemo)
              .sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded))
              .slice(0, 15);
          }, [songs]);

          // 楽曲フィルタリング
          const filteredSongs = useMemo(() => {
            let list = [];
            if (currentPlaylist === 'all') {
              list = songs;
            } else if (currentPlaylist === 'latest15') {
              list = latest15Songs;
            } else {
              const targetPl = playlists.find(p => p.id === currentPlaylist);
              if (targetPl) {
                list = songs.filter(s => targetPl.songFilenames.includes(s.filename));
              } else {
                list = songs;
              }
            }

            if (searchQuery.trim() !== '') {
              const query = searchQuery.toLowerCase();
              list = list.filter(song => 
                song.title.toLowerCase().includes(query) ||
                song.artist.toLowerCase().includes(query) ||
                song.highestChest.toLowerCase().includes(query) ||
                (song.comments && song.comments.toLowerCase().includes(query))
              );
            }
            return list;
          }, [songs, currentPlaylist, playlists, searchQuery, latest15Songs]);

          // 同じまたは近い「類似地声音階」の楽曲を算出するロジック (前後2半音以内)
          const similarPitchSongs = useMemo(() => {
            if (!currentSong || !currentSong.highestChest || currentSong.highestChest === '未設定') return [];
            
            const targetPitch = currentSong.highestChest.toLowerCase().trim();
            const targetIdx = PITCH_ORDER.indexOf(targetPitch);
            
            if (targetIdx === -1) {
              // テーブルにない特殊な表記のものは完全一致のみで抽出
              return songs.filter(s => s.filename !== currentSong.filename && s.highestChest.toLowerCase().trim() === targetPitch);
            }

            return songs.filter(s => {
              if (s.filename === currentSong.filename) return false;
              const p = s.highestChest.toLowerCase().trim();
              const idx = PITCH_ORDER.indexOf(p);
              if (idx === -1) return false;
              return Math.abs(idx - targetIdx) <= 2; // 前後2半音差までをピックアップ
            });
          }, [currentSong, songs]);

          // 再生状態（isPlaying）を引き継いだまま、選択された新しい曲を適切にロード・再生するコア関数
          const changeSong = async (song, startPlay = isPlaying) => {
            if (!song) return;
            
            setCurrentSong(song);
            setLoadedSong(song);
            
            // 疑似波形をまず瞬時にセット（ロード待ちの空白時間をゼロにする）
            generateFallbackWaveform(song.filename);
            
            // 裏で最高音のパースを即時実行
            analyzeSongBackground(song);

            if (song.isDemo) {
              const demoUrl = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
              if (audioRef.current) {
                audioRef.current.src = demoUrl;
                if (startPlay) {
                  setIsPlaying(true);
                  audioRef.current.play()
                    .then(() => {
                      setupAudioContext();
                      updateMediaSession(song);
                    })
                    .catch(() => showStatus("画面をタップして自動再生を解除してください", "info"));
                } else {
                  setIsPlaying(false);
                  audioRef.current.pause();
                }
              }
              return;
            }

            let file = fileMap.get(song.filename);
            
            // A. メモリやIndexedDBにファイルキャッシュがない場合、クラウドから自動取得
            if (!file && settings.cloudBaseUrl) {
              showStatus("クラウドから音源を自動ロード中...", "info");
              try {
                let base = settings.cloudBaseUrl;
                if (!base.endsWith('/')) base += '/';

                const targetUrl = base + encodeURIComponent(song.filename);
                const response = await fetch(targetUrl);
                
                if (!response.ok) throw new Error("クラウド音源の取得に失敗しました");
                const audioBlob = await response.blob();
                
                file = new File([audioBlob], song.filename, { type: audioBlob.type });
                const newFileMap = new Map(fileMap);
                newFileMap.set(song.filename, file);
                setFileMap(newFileMap);

                if (settings.autoLocalCache) {
                  try {
                    const record = await getFromDB(STORE_SONGS, song.filename);
                    if (record) {
                      record.fileBlob = file;
                      await saveToDB(STORE_SONGS, record);
                      setSongs(prev => prev.map(s => s.filename === song.filename ? { ...s, fileBlob: file } : s));
                    }
                  } catch (e) {
                    console.warn("ローカルDB永続化エラー:", e);
                  }
                }
                showStatus("ダウンロード＆マウント成功！", "success");
              } catch (err) {
                console.error("Cloud Fetch Error:", err);
                showStatus("自動ダウンロードに失敗。ローカルから指定してください。", "error");
              }
            }

            // B. 音源が存在しない場合は、個別紐付け要求画面を立ち上げる（この場合は一時停止にする）
            if (!file) {
              setIsPlaying(false);
              if (audioRef.current) {
                audioRef.current.pause();
              }
              setUnresolvedSong(song);
              setMascotMood('angry');
              return;
            }

            // C. 音源を展開
            const url = URL.createObjectURL(file);
            if (audioRef.current) {
              if (audioRef.current.src && audioRef.current.src.startsWith('blob:')) {
                URL.revokeObjectURL(audioRef.current.src);
              }
              
              audioRef.current.src = url;
              
              if (startPlay) {
                setIsPlaying(true);
                audioRef.current.play()
                  .then(() => {
                    setupAudioContext();
                    updateMediaSession(song);
                    decodeAndGenerateWaveform(file);
                    setTimeout(() => {
                      analyzeSongBackground(song, true);
                    }, 4000);
                  })
                  .catch(err => {
                    console.error("Play Error:", err);
                    showStatus("再生エラー。もう一度タップしてください。", "error");
                  });
              } else {
                setIsPlaying(false);
                audioRef.current.pause();
                // 一時停止中であっても波形データ自体のデコードは裏で行っておく
                decodeAndGenerateWaveform(file);
              }
            }
          };

          // ライブラリをタップした際、新曲の詳細データを詳細画面にセットし、一旦安全に一時停止する
          const selectSongDetail = (song) => {
            changeSong(song, false);
          };

          // 再生制御：詳細画面で再生ボタンを押した時に実際に再生開始する
          const playSong = async (song) => {
            changeSong(song, true);
          };

          const handleResolveSongFile = async (e) => {
            const file = e.target.files[0];
            if (!file || !unresolvedSong) return;

            const newFileMap = new Map(fileMap);
            newFileMap.set(unresolvedSong.filename, file);
            setFileMap(newFileMap);

            try {
              const record = await getFromDB(STORE_SONGS, unresolvedSong.filename);
              if (record) {
                record.fileBlob = file;
                await saveToDB(STORE_SONGS, record);
                setSongs(prev => prev.map(s => s.filename === unresolvedSong.filename ? { ...s, fileBlob: file } : s));
              }
            } catch (err) {
              console.warn("DB個別キャッシュの保存失敗:", err);
            }

            const targetSong = unresolvedSong;
            setUnresolvedSong(null);
            showStatus("マウント完了！再生可能です。", "success");
            
            setTimeout(() => {
              playSong(targetSong);
            }, 300);
          };

          // 再生/一時停止トグル
          const togglePlay = () => {
            if (!currentSong) {
              if (filteredSongs.length > 0) {
                selectSongDetail(filteredSongs[0]);
              }
              return;
            }

            if (!audioRef.current) return;

            // オーディオにまだ曲がロードされていない、または選択中の曲と異なる場合
            if (!loadedSong || loadedSong.filename !== currentSong.filename) {
              playSong(currentSong);
              return;
            }

            if (isPlaying) {
              audioRef.current.pause();
              setIsPlaying(false);
            } else {
              audioRef.current.play()
                .then(() => {
                  setIsPlaying(true);
                  setupAudioContext();
                })
                .catch(() => showStatus("画面をタップして再生してください", "info"));
            }
          };

          // 「次の曲」を押した際は、現在の再生状態(isPlaying)を維持したまま切り替え
          const handleNext = () => {
            if (filteredSongs.length === 0) return;
            let nextSong = null;
            if (isShuffle) {
              const rnd = Math.floor(Math.random() * filteredSongs.length);
              nextSong = filteredSongs[rnd];
            } else {
              const idx = filteredSongs.findIndex(s => s.filename === currentSong?.filename);
              if (idx === -1 || idx === filteredSongs.length - 1) {
                nextSong = filteredSongs[0];
              } else {
                nextSong = filteredSongs[idx + 1];
              }
            }
            if (nextSong) {
              changeSong(nextSong, isPlaying);
            }
          };

          // 「前の曲」を押した際も、現在の再生状態(isPlaying)を維持したまま切り替え
          const handlePrev = () => {
            if (filteredSongs.length === 0) return;
            let prevSong = null;
            const idx = filteredSongs.findIndex(s => s.filename === currentSong?.filename);
            if (idx === -1 || idx === 0) {
              prevSong = filteredSongs[filteredSongs.length - 1];
            } else {
              prevSong = filteredSongs[idx - 1];
            }
            if (prevSong) {
              changeSong(prevSong, isPlaying);
            }
          };

          const setupAudioContext = () => {
            if (!audioContextRef.current) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              audioContextRef.current = new AudioCtx();
            }
            if (audioContextRef.current.state === 'suspended') {
              audioContextRef.current.resume();
            }
            if (!analyserRef.current && audioRef.current) {
              const ctx = audioContextRef.current;
              analyserRef.current = ctx.createAnalyser();
              analyserRef.current.fftSize = 128;
              try {
                const src = ctx.createMediaElementSource(audioRef.current);
                src.connect(analyserRef.current);
                analyserRef.current.connect(ctx.destination);
              } catch (e) {
                console.log("Audio node linked.");
              }
            }
            animateWave();
          };

          // WAV波形のビジュアル描画（視認性の極限強化版）
          const animateWave = () => {
            if (!canvasRef.current) return;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            let volumeMultiplier = 0;
            if (analyserRef.current && isPlaying) {
              const dataArray = new Uint8Array(analyserRef.current.frequencyBinCount);
              analyserRef.current.getByteFrequencyData(dataArray);
              const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
              volumeMultiplier = avg / 255;
            }

            ctx.clearRect(0, 0, width, height);

            // 背景目盛りグリッド
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < width; i += 40) {
              ctx.beginPath();
              ctx.moveTo(i, 0);
              ctx.lineTo(i, height);
              ctx.stroke();
            }

            const audioEl = audioRef.current;
            const curTime = audioEl ? audioEl.currentTime : 0;
            const dur = audioEl ? audioEl.duration : 0;
            const progress = dur > 0 ? curTime / dur : 0;
            const currentBarIndex = Math.floor(progress * waveformPeaks.length);

            if (waveformPeaks.length > 0) {
              const barWidth = width / waveformPeaks.length;
              const centerY = height / 2;

              waveformPeaks.forEach((peak, i) => {
                const x = i * barWidth;
                const active = i <= currentBarIndex;
                
                const bounce = active && isPlaying ? 1.0 + (volumeMultiplier * 0.45) : 1.0;
                const barHeight = peak * (height * 0.85) * bounce; 
                const topY = centerY - barHeight / 2;

                ctx.beginPath();
                if (active) {
                  // 超視認性の高いマゼンタからシアン
                  const gradient = ctx.createLinearGradient(x, topY, x, topY + barHeight);
                  gradient.addColorStop(0, '#00f2fe'); 
                  gradient.addColorStop(0.5, '#4facfe'); 
                  gradient.addColorStop(1, '#f43f5e'); 
                  ctx.fillStyle = gradient;
                } else {
                  ctx.fillStyle = 'rgba(6, 182, 212, 0.22)'; 
                }

                const radius = Math.max(1.5, barWidth / 2 - 0.5);
                if (ctx.roundRect) {
                  ctx.roundRect(x + 1, topY, barWidth - 1.2, barHeight, radius);
                } else {
                  ctx.rect(x + 1, topY, barWidth - 1.2, barHeight);
                }
                ctx.fill();
              });

              const cursorX = progress * width;
              ctx.shadowBlur = 10;
              ctx.shadowColor = '#00f2fe';
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 4; 
              ctx.beginPath();
              ctx.moveTo(cursorX, 0);
              ctx.lineTo(cursorX, height);
              ctx.stroke();
              ctx.shadowBlur = 0;
            } else {
              ctx.fillStyle = 'rgba(6, 182, 212, 0.6)';
              ctx.font = 'bold 16px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('再生すると波形が表示されます', width / 2, height / 2 + 5);
            }

            animationFrameRef.current = requestAnimationFrame(animateWave);
          };

          const handleWaveformClick = (e) => {
            if (!audioRef.current || !canvasRef.current || duration === 0) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const ratio = clickX / rect.width;
            const nextTime = ratio * duration;
            audioRef.current.currentTime = nextTime;
            setCurrentTime(nextTime);
          };

          const handleTimeUpdate = () => {
            if (audioRef.current) setCurrentTime(audioRef.current.currentTime);
          };

          const handleLoadedMetadata = () => {
            if (audioRef.current) setDuration(audioRef.current.duration);
          };

          const handleVolumeChange = (e) => {
            const val = parseFloat(e.target.value);
            setVolume(val);
            if (audioRef.current) audioRef.current.volume = val;
            setIsMuted(val === 0);
          };

          const toggleMute = () => {
            if (audioRef.current) {
              const target = !isMuted;
              audioRef.current.muted = target;
              setIsMuted(target);
            }
          };

          const openEditModal = (song) => {
            setEditingSong({ ...song });
            setIsEditModalOpen(true);
          };

          const saveSongMetadata = async () => {
            if (!editingSong) return;
            try {
              const existing = await getFromDB(STORE_SONGS, editingSong.filename);
              const dataToSave = { ...editingSong };
              if (existing && existing.fileBlob) {
                dataToSave.fileBlob = existing.fileBlob; 
              }
              await saveToDB(STORE_SONGS, dataToSave);
              setSongs(songs.map(s => s.filename === editingSong.filename ? dataToSave : s));
              if (currentSong && currentSong.filename === editingSong.filename) {
                setCurrentSong(dataToSave);
              }
              setIsEditModalOpen(false);
              showStatus(`「${editingSong.title}」をアップデート！`, 'success');
            } catch (err) {
              showStatus('保存できませんでした', 'error');
            }
          };

          const handleCreatePlaylist = async () => {
            if (!newPlaylistName.trim()) return;
            const newPl = {
              id: 'pl_' + Date.now(),
              name: newPlaylistName.trim(), 
              songFilenames: []
            };
            await saveToDB(STORE_PLAYLISTS, newPl);
            setPlaylists([...playlists, newPl]);
            setNewPlaylistName('');
            setIsPlaylistModalOpen(false);
            showStatus(`プレイリスト「${newPl.name}」を作成しました！`, 'success');
          };

          const toggleSongInPlaylist = async (playlistId, filename) => {
            const targetPl = playlists.find(p => p.id === playlistId);
            if (!targetPl) return;

            let updatedFilenames;
            if (targetPl.songFilenames.includes(filename)) {
              updatedFilenames = targetPl.songFilenames.filter(f => f !== filename);
              showStatus('プレイリストから除外しました', 'info');
            } else {
              updatedFilenames = [...targetPl.songFilenames, filename];
              showStatus('プレイリストへ追加しました！', 'success');
            }

            const updatedPl = { ...targetPl, songFilenames: updatedFilenames };
            await saveToDB(STORE_PLAYLISTS, updatedPl);
            setPlaylists(playlists.map(p => p.id === playlistId ? updatedPl : p));
          };

          const deletePlaylist = async (playlistId, e) => {
            e.stopPropagation();
            if (playlistId === 'fav' || playlistId === 'practice') {
              showStatus('標準リストは削除不可能です', 'error');
              return;
            }
            await deleteFromDB(STORE_PLAYLISTS, playlistId);
            setPlaylists(playlists.filter(p => p.id !== playlistId));
            if (currentPlaylist === playlistId) setCurrentPlaylist('all');
            showStatus('プレイリストを削除しました', 'info');
          };

          const exportDatabase = () => {
            const lightSongs = songs.map(s => {
              const copy = { ...s };
              delete copy.fileBlob;
              return copy;
            });
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ songs: lightSongs, playlists }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "vocal_archive_database.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showStatus("歌唱データをエクスポート完了！", "success");
          };

          const importDatabase = (e) => {
            const fileReader = new FileReader();
            fileReader.onload = async (event) => {
              try {
                const parsed = JSON.parse(event.target.result);
                if (parsed.songs) {
                  for (const s of parsed.songs) {
                    const existing = await getFromDB(STORE_SONGS, s.filename);
                    if (existing && existing.fileBlob) {
                      s.fileBlob = existing.fileBlob; 
                    }
                    await saveToDB(STORE_SONGS, s);
                  }
                  setSongs(parsed.songs);
                }
                if (parsed.playlists) {
                  for (const p of parsed.playlists) {
                    await saveToDB(STORE_PLAYLISTS, p);
                  }
                  setPlaylists(parsed.playlists);
                }
                showStatus("歌唱リスト＆情報を復元・同期しました！", "success");
              } catch (err) {
                showStatus("JSON解析エラー", "error");
              }
            };
            if (e.target.files[0]) {
              fileReader.readAsText(e.target.files[0]);
            }
          };

          const formatTime = (secs) => {
            if (isNaN(secs)) return "0:00";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
          };

          // 個別音源キャッシュ削除
          const handleClearSongCache = async (song, e) => {
            e.stopPropagation();
            const record = await getFromDB(STORE_SONGS, song.filename);
            if (record) {
              delete record.fileBlob; 
              await saveToDB(STORE_SONGS, record);
              
              const newFileMap = new Map(fileMap);
              newFileMap.delete(song.filename);
              setFileMap(newFileMap);

              setSongs(prev => prev.map(s => s.filename === song.filename ? { ...s, fileBlob: undefined } : s));
              if (currentSong?.filename === song.filename) {
                setCurrentSong(prev => ({ ...prev, fileBlob: undefined }));
              }
              showStatus(`「${song.title}」の音源キャッシュをクリアしました`, 'info');
            }
          };

          // 全キャッシュ削除
          const handleClearAllCaches = async () => {
            if (!confirm("保存されているすべての実音声ファイルキャッシュを削除しますか？(最高音やコメントのテキストデータは削除されません)")) {
              return;
            }
            const savedSongs = await getAllFromDB(STORE_SONGS);
            for (const s of savedSongs) {
              if (s.fileBlob) {
                delete s.fileBlob;
                await saveToDB(STORE_SONGS, s);
              }
            }
            setFileMap(new Map());
            setSongs(savedSongs.map(s => { delete s.fileBlob; return s; }));
            showStatus("すべての音声キャッシュをクリアしました", "info");
          };

          // ==========================================
          // 【新設】データベースの完全初期化（全楽曲リストの完全削除）
          // ==========================================
          const handleAbsoluteClearDatabase = async () => {
            try {
              // IndexedDBからメタデータ、プレイリスト、設定を全消去
              const db = await initDB();
              return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_SONGS, STORE_PLAYLISTS], 'readwrite');
                
                const songsStore = transaction.objectStore(STORE_SONGS);
                const playlistStore = transaction.objectStore(STORE_PLAYLISTS);
                
                songsStore.clear();
                playlistStore.clear();

                transaction.oncomplete = async () => {
                  // 初期デモ曲のみ再セットアップ
                  const demoSongs = [
                    {
                      filename: 'デモ_うたねこのテーマ_OriginalKey.mp3',
                      artist: 'うたねこ楽団',
                      title: 'うたねこのテーマ',
                      version: 'OriginalKey',
                      highestChest: 'hiB',
                      rating: 5,
                      comments: '歌唱アーカイブへようこそ！WAVファイルを上の「登録/同期」からマウントして再生できます。一度取り込んだ音源はリロードしても保持されます。',
                      dateAdded: new Date().toISOString(),
                      isDemo: true
                    }
                  ];
                  
                  // IndexedDBに書き込み
                  await saveToDB(STORE_SONGS, demoSongs[0]);

                  const initialPlaylists = [
                    { id: 'fav', name: 'お気に入り', songFilenames: [] },
                    { id: 'practice', name: 'カラオケ特訓中', songFilenames: [] }
                  ];
                  for (const pl of initialPlaylists) {
                    await saveToDB(STORE_PLAYLISTS, pl);
                  }

                  // 状態の完全初期化
                  setSongs(demoSongs);
                  setFileMap(new Map());
                  setPlaylists(initialPlaylists);
                  setCurrentPlaylist('all');
                  setCurrentSong(null);
                  setLoadedSong(null);
                  setIsPlaying(false);
                  
                  if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.src = "";
                  }

                  setIsDeleteConfirmOpen(false);
                  showStatus("歌唱データベースを完全に初期化しました", "success");
                  setActiveTab('library');
                  resolve();
                };

                transaction.onerror = () => {
                  showStatus("データベースの初期化中にエラーが発生しました", "error");
                  reject(transaction.error);
                };
              });
            } catch (err) {
              console.error("Database clear failed:", err);
              showStatus("初期化に失敗しました", "error");
            }
          };

          return (
            /* 絶対位置 fixed inset-0 により、スマホの上下バー伸縮に伴う表示ちぎれとはみ出しを完全防御 */
            <div className="fixed inset-0 h-[100dvh] flex flex-col justify-between bg-neutral-950 text-neutral-100 font-sans overflow-hidden select-none">
              
              <audio 
                ref={audioRef}
                onTimeUpdate={handleTimeUpdate}
                onLoadedMetadata={handleLoadedMetadata}
                onEnded={handleNext}
                playsInline
              />

              {/* ==========================================
                  ヘッダー (ロゴ・インフォ)
                  ========================================== */}
              <header className="flex-shrink-0 border-b border-neutral-900 bg-neutral-950 px-4 py-2.5 flex items-center justify-between z-30">
                <div className="flex items-center gap-2">
                  <CharacterMascot className="w-12 h-12" mood={mascotMood} isPlaying={isPlaying} />
                  <div>
                    <h1 className="text-xl font-black tracking-widest text-rose-500 flex items-center gap-1.5">
                      ウタアーカイブ <span className="text-[10px] bg-rose-600 text-white font-extrabold px-1.5 py-0.5 rounded">MOBILE</span>
                    </h1>
                    <p className="text-sm text-neutral-400 font-bold">選曲 ＆ 歌声キーデータベース</p>
                  </div>
                </div>

                {statusMessage.text && (
                  <div className="absolute top-12 left-1/2 -translate-x-1/2 bg-neutral-900/95 border-2 border-rose-500 text-white px-5 py-2.5 rounded-full text-sm font-black shadow-2xl z-50 flex items-center gap-2.5 transition-all">
                    <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping" />
                    {statusMessage.text}
                  </div>
                )}

                <div className="flex items-center gap-1">
                  <button 
                    onClick={() => setIsInfoModalOpen(true)}
                    className="p-2.5 text-neutral-400 hover:text-white rounded-lg transition-colors"
                  >
                    <SvgIcon name="info" className="w-6 h-6" />
                  </button>
                </div>
              </header>

              {/* ==========================================
                  ヘッダー直下のスマホ用上部ナビゲーション
                  【巨大化バグ修正】アイコンサイズをw-5 h-5の実在クラスへ統合
                  ========================================== */}
              <nav className="flex-shrink-0 border-b border-neutral-900 bg-neutral-900/40 grid grid-cols-3 text-center z-30">
                <button 
                  onClick={() => setActiveTab('player')}
                  className={`flex items-center justify-center gap-2 py-4 text-base font-black transition-all ${
                    activeTab === 'player' ? 'text-rose-500 border-b-4 border-rose-500 bg-rose-950/10' : 'text-neutral-400'
                  }`}
                >
                  <SvgIcon name="music" className="w-5 h-5" />
                  <span>再生画面</span>
                </button>

                <button 
                  onClick={() => setActiveTab('library')}
                  className={`flex items-center justify-center gap-2 py-4 text-base font-black transition-all ${
                    activeTab === 'library' ? 'text-rose-500 border-b-4 border-rose-500 bg-rose-950/10' : 'text-neutral-400'
                  }`}
                >
                  <SvgIcon name="listMusic" className="w-5 h-5" />
                  <span>ライブラリ</span>
                </button>

                <button 
                  onClick={() => setActiveTab('input_data')}
                  className={`flex items-center justify-center gap-2 py-4 text-base font-black transition-all ${
                    activeTab === 'input_data' ? 'text-rose-500 border-b-4 border-rose-500 bg-rose-950/10' : 'text-neutral-400'
                  }`}
                >
                  <SvgIcon name="folderOpen" className="w-5 h-5" />
                  <span>登録 / 同期</span>
                </button>
              </nav>

              {/* ==========================================
                  メインスクロールエリア
                  ========================================== */}
              <main className="flex-1 overflow-hidden relative bg-neutral-950">
                
                {/* TAB 1: PLAYER (大画面再生表示) */}
                <div className={`absolute inset-0 p-4 flex flex-col justify-between overflow-y-auto smooth-scroll transition-transform duration-300 ${
                  activeTab === 'player' ? 'translate-x-0' : '-translate-x-full pointer-events-none'
                }`}>
                  
                  <div className="flex-1 flex flex-col items-center justify-start py-4 space-y-4">
                    {currentSong ? (
                      <div className="text-center w-full max-w-sm space-y-5">
                        
                        {/* 歌唱連動特大キャラクター表示 */}
                        <div className="relative mx-auto w-44 h-44 flex items-center justify-center bg-neutral-900/60 rounded-3xl border border-neutral-800 p-4 shadow-2xl">
                          <CharacterMascot className="w-36 h-36" mood={mascotMood} isPlaying={isPlaying} />
                        </div>
                        
                        <div>
                          <h2 className="text-2xl font-black text-white line-clamp-2 px-3 leading-snug">{currentSong.title}</h2>
                          <p className="text-lg text-rose-500 font-extrabold mt-1.5 line-clamp-1">{currentSong.artist}</p>
                        </div>
                        
                        <div className="flex items-center justify-center gap-2">
                          <span className="px-3.5 py-1.5 bg-neutral-900 text-sm text-neutral-300 rounded-full border border-neutral-800 font-bold font-mono">
                            {currentSong.version}
                          </span>
                          {currentSong.isDemo && (
                            <span className="px-3.5 py-1.5 bg-amber-950 text-sm text-amber-400 rounded-full border border-amber-900 font-bold">
                              デモ音源
                            </span>
                          )}
                          {fileMap.has(currentSong.filename) && (
                            <span className="px-3.5 py-1.5 bg-emerald-950/80 text-emerald-400 text-sm rounded-full border border-emerald-900/40 font-bold">
                              スマホ内保持
                            </span>
                          )}
                        </div>

                        {/* 特大・歌唱スタッツ表示 (文字サイズ拡大) */}
                        <div className="bg-neutral-900/80 p-4 rounded-2xl border-2 border-rose-500/30 shadow-inner max-w-xs mx-auto">
                          <span className="text-sm text-rose-400 font-black block tracking-widest mb-1">【地声最高音】</span>
                          <span className="text-4xl font-black text-white font-mono tracking-tight">{currentSong.highestChest || '未設定'}</span>
                        </div>

                        {/* 類似地声音階の楽曲ショートカット */}
                        {similarPitchSongs.length > 0 && (
                          <div className="bg-neutral-900/40 p-3 rounded-2xl border border-neutral-900 text-left space-y-2">
                            <span className="text-sm text-neutral-400 font-black block">【近い音域の持ち歌】 ({similarPitchSongs.length}曲):</span>
                            <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                              {similarPitchSongs.slice(0, 8).map(song => (
                                <button
                                  key={song.filename}
                                  onClick={() => selectSongDetail(song)}
                                  className="flex-shrink-0 px-3 py-2.5 bg-neutral-950 border border-neutral-800 hover:border-rose-500 rounded-xl text-sm font-bold text-neutral-300 active:scale-95 transition-all flex items-center gap-1.5"
                                >
                                  <span className="text-rose-400 font-black font-mono">{song.highestChest}</span>
                                  <span className="truncate max-w-[90px]">{song.title}</span>
                                </button>
                              ))}
                            </div>
                          </div>
                        )}

                        {currentSong.comments && (
                          <div className="text-left text-sm text-neutral-200 bg-neutral-900/50 p-4 rounded-xl border border-neutral-900/50 leading-relaxed font-bold">
                            【練習メモ】<br/>
                            <span className="text-neutral-300 font-medium text-sm mt-1 block">{currentSong.comments}</span>
                          </div>
                        )}

                      </div>
                    ) : (
                      <div className="text-center py-12 px-6">
                        <CharacterMascot className="w-36 h-36 mx-auto opacity-35" mood="idle" />
                        <h3 className="text-base font-bold text-neutral-400 mt-4">再生する曲を選択してください</h3>
                        <p className="text-sm text-neutral-600 mt-2 max-w-xs mx-auto leading-relaxed">
                          隣 of 「ライブラリ」をタップして曲の詳細を確認し、そこから大きな再生ボタンを押して練習を開始します。
                        </p>
                      </div>
                    )}
                  </div>
                </div>

                {/* TAB 2: LIBRARY (曲リスト・検索・プレイリスト) */}
                <div className={`absolute inset-0 flex flex-col bg-neutral-950 transition-transform duration-300 ${
                  activeTab === 'library' ? 'translate-x-0' : 'translate-x-full pointer-events-none'
                }`}>
                  
                  {/* リスト固定上部エリア */}
                  <div className="p-3 border-b border-neutral-900 bg-neutral-950 space-y-2.5 flex-shrink-0">
                    
                    {/* プレイリスト切り替え (文字化け ?? を完全にクリア) */}
                    <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                      <button 
                        onClick={() => setCurrentPlaylist('all')} 
                        className={`px-4 py-2.5 rounded-full text-xs font-black whitespace-nowrap transition-all ${
                          currentPlaylist === 'all' ? 'bg-rose-500 text-neutral-950 shadow-md shadow-rose-500/10' : 'bg-neutral-900 text-neutral-400'
                        }`}
                      >
                        すべて ({songs.length})
                      </button>
                      <button 
                        onClick={() => setCurrentPlaylist('latest15')} 
                        className={`px-4 py-2.5 rounded-full text-xs font-black whitespace-nowrap transition-all ${
                          currentPlaylist === 'latest15' ? 'bg-cyan-500 text-neutral-950 shadow-md shadow-cyan-500/10' : 'bg-neutral-900 text-neutral-400'
                        }`}
                      >
                        最新15曲 ({latest15Songs.length})
                      </button>
                      {playlists.map(pl => (
                        <button
                          key={pl.id}
                          onClick={() => setCurrentPlaylist(pl.id)}
                          className={`px-4 py-2.5 rounded-full text-xs font-black whitespace-nowrap flex items-center gap-1 transition-all ${
                            currentPlaylist === pl.id ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-neutral-900 text-neutral-400'
                          }`}
                        >
                          <span>{pl.name}</span>
                          <span className="text-[11px] opacity-65 font-black">({pl.songFilenames?.length || 0})</span>
                        </button>
                      ))}
                      <button 
                        onClick={() => setIsPlaylistModalOpen(true)}
                        className="px-3.5 py-2 rounded-full text-xs bg-neutral-900 text-neutral-500 border border-neutral-800 flex items-center gap-1 font-bold"
                      >
                        <SvgIcon name="plus" className="w-5 h-5" /> 新規作成
                      </button>
                    </div>

                    {/* 検索入力 */}
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 text-neutral-400">
                        <SvgIcon name="search" className="w-5 h-5" />
                      </span>
                      <input 
                        type="text" 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="曲名・歌手名・最高音・コメントから検索..." 
                        className="w-full pl-10 pr-9 py-2.5 bg-neutral-900 border border-neutral-900 rounded-xl focus:outline-none focus:ring-1 focus:ring-rose-500 text-sm placeholder:text-neutral-500 text-white font-bold"
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 flex items-center pr-3.5 text-neutral-500">
                          <SvgIcon name="x" className="w-5 h-5" />
                        </button>
                      )}
                    </div>

                  </div>

                  {/* 独立スクロール曲リスト (タップで詳細画面へ遷移) */}
                  <div className="flex-1 overflow-y-auto divide-y divide-neutral-900 bg-neutral-950/30 smooth-scroll">
                    {filteredSongs.length > 0 ? (
                      filteredSongs.map((song, idx) => {
                        const isSelected = currentSong?.filename === song.filename;
                        const fileLoaded = fileMap.has(song.filename);
                        const hasCloudOption = !!settings.cloudBaseUrl;

                        return (
                          <div 
                            key={song.filename} 
                            className={`flex items-center justify-between p-4 transition-colors active:bg-neutral-900 select-none ${
                              isSelected ? 'bg-rose-950/15 border-l-4 border-rose-500' : 'hover:bg-neutral-900/20'
                            }`}
                            onClick={() => selectSongDetail(song)}
                          >
                            <div className="min-w-0 flex-1 flex items-center gap-3.5">
                              
                              {/* 番号 */}
                              <div className="flex-shrink-0 w-6 flex justify-center">
                                <div className="text-sm font-mono font-black text-neutral-500">
                                  {idx + 1}
                                </div>
                              </div>

                              {/* タイトル等 (文字サイズ拡大) */}
                              <div className="min-w-0 flex-1 space-y-1">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <p className={`text-base font-black truncate leading-tight ${isSelected ? 'text-rose-400' : 'text-neutral-100'}`}>
                                    {song.title}
                                  </p>
                                  {song.isDemo ? (
                                    <span className="text-[9px] font-bold bg-amber-950/80 border border-amber-800 text-amber-400 px-1 py-0.2 rounded">デモ</span>
                                  ) : fileLoaded ? (
                                    <span className="text-[9px] font-black bg-emerald-950/90 border border-emerald-900 text-emerald-400 px-1.5 py-0.2 rounded">
                                      保存済
                                    </span>
                                  ) : hasCloudOption ? (
                                    <span className="text-[9px] font-black bg-sky-950/90 border border-sky-900 text-sky-400 px-1.5 py-0.2 rounded">
                                      クラウド
                                    </span>
                                  ) : (
                                    <span className="text-[9px] font-black bg-neutral-900 border border-rose-950 text-rose-400/90 px-1.5 py-0.2 rounded tracking-tight">
                                      未同期
                                    </span>
                                  )}
