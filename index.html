<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .play-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-40">
    <div class="max-w-md mx-auto p-4">
        <div id="listScreen">
            <header class="mb-6 text-center"><h1 class="text-3xl font-extrabold text-gray-800">UTA-ARCHIVE</h1></header>
            <div id="songList" class="space-y-3">読み込み中...</div>
        </div>

        <div id="playerScreen" class="hidden">
            <button onclick="showList()" class="mb-4 text-blue-600 font-bold">&larr; リストに戻る</button>
            <div id="playerContent" class="bg-white p-8 rounded-3xl shadow-lg text-center"></div>
        </div>

        <div id="miniPlayer" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-2xl z-50 rounded-t-3xl">
            <p id="miniTitle" class="text-sm font-bold mb-4 truncate text-center"></p>
            <div class="flex justify-center items-center gap-6 text-2xl">
                <button id="shuffleBtn" onclick="toggleShuffle()" class="text-xs text-gray-400">シャッフル:OFF</button>
                <button onclick="skip(-1)">⏮</button>
                <button onclick="togglePlay()" id="mainPlayBtn" class="bg-blue-600 text-white w-16 h-16 rounded-full shadow-lg flex items-center justify-center">▶</button>
                <button onclick="skip(1)">⏭</button>
                <button id="repeatBtn" onclick="toggleRepeat()" class="text-xs text-gray-400">リピート:OFF</button>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [], currentIndex = 0, isShuffle = false, repeatMode = 0;
        let audioPlayer = new Audio();

        document.addEventListener('DOMContentLoaded', async () => {
            const baseUrl = window.location.href.split('/').slice(0, -1).join('/');
            try {
                const response = await fetch(`${baseUrl}/data.json`);
                allSongs = await response.json();
                renderList();
            } catch (e) { document.getElementById('songList').innerHTML = 'データ取得エラー'; }
            
            audioPlayer.onended = () => {
                if(repeatMode === 2) { audioPlayer.play(); } else { skip(1); }
            };
        });

        function renderList() {
            const list = document.getElementById('songList');
            allSongs.forEach((song, i) => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer';
                div.innerHTML = `<h2 class="font-bold">${song.title}</h2><p class="text-xs text-gray-500">${song.artist}</p>`;
                div.onclick = () => loadAndPlay(i);
                list.appendChild(div);
            });
        }

        function loadAndPlay(index) {
            currentIndex = index;
            audioPlayer.src = allSongs[index].url;
            audioPlayer.play().catch(e => console.log("再生待機中"));
            document.getElementById('miniPlayer').classList.remove('hidden');
            document.getElementById('miniTitle').innerText = allSongs[index].title;
            document.getElementById('mainPlayBtn').innerText = '⏸';
        }

        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                document.getElementById('mainPlayBtn').innerText = '⏸';
            } else {
                audioPlayer.pause();
                document.getElementById('mainPlayBtn').innerText = '▶';
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').innerText = isShuffle ? 'シャッフル:ON' : 'シャッフル:OFF';
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            const labels = ['リピート:OFF', 'リピート:全曲', 'リピート:1曲'];
            document.getElementById('repeatBtn').innerText = labels[repeatMode];
        }

        function skip(dir) {
            if (isShuffle) currentIndex = Math.floor(Math.random() * allSongs.length);
            else currentIndex = (currentIndex + dir + allSongs.length) % allSongs.length;
            loadAndPlay(currentIndex);
        }

        function showList() {
            document.getElementById('playerScreen').classList.add('hidden');
            document.getElementById('listScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
