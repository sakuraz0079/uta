<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-24">
    <div class="max-w-md mx-auto p-4">
        <!-- ナビゲーション -->
        <nav class="flex gap-4 mb-6 text-sm font-bold text-gray-500 overflow-x-auto pb-2">
            <button onclick="renderList('全楽曲')" class="whitespace-nowrap">全楽曲</button>
            <button onclick="showScreen('playlistScreen')" class="whitespace-nowrap text-blue-600">再生リスト</button>
        </nav>

        <!-- 再生リスト管理画面 -->
        <div id="playlistScreen" class="hidden">
            <h1 class="text-2xl font-extrabold mb-4">再生リスト</h1>
            <div class="flex gap-2 mb-4">
                <input id="newPlaylistName" type="text" placeholder="新規リスト名" class="flex-grow p-2 border rounded">
                <button onclick="createPlaylist()" class="bg-blue-600 text-white px-4 rounded font-bold">+</button>
            </div>
            <div id="playlistList" class="space-y-2"></div>
        </div>

        <!-- 楽曲リスト画面 -->
        <div id="listScreen">
            <div class="flex justify-between items-center mb-4">
                <h1 id="listTitle" class="text-2xl font-extrabold">全楽曲</h1>
                <button onclick="showScreen('playlistScreen')" class="text-sm text-blue-600">リスト選択</button>
            </div>
            <div id="songList" class="space-y-3">読み込み中...</div>
        </div>

        <!-- プレイヤー詳細画面 -->
        <div id="playerScreen" class="hidden">
            <button onclick="showScreen('listScreen')" class="mb-4 text-blue-600 font-bold">&larr; リストに戻る</button>
            <div id="playerContent" class="bg-white p-8 rounded-3xl shadow-lg"></div>
        </div>

        <!-- ミニプレイヤー -->
        <div id="miniPlayer" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-2xl z-50">
            <p id="miniTitle" class="text-sm font-bold mb-2 truncate text-center"></p>
            <div class="flex justify-center items-center gap-6 text-2xl">
                <button onclick="togglePlay()" id="mainPlayBtn" class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center">▶</button>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let audioPlayer = new Audio();
        let playlists = JSON.parse(localStorage.getItem('myPlaylists')) || { 
            "最新20曲": [], 
            "お気に入り": [] 
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await loadData();
            updateLatest20();
            renderList('全楽曲');
        });

        async function loadData() {
            try {
                const response = await fetch('data.json');
                allSongs = await response.json();
            } catch (error) {
                console.error("data.jsonの読み込みに失敗しました:", error);
                document.getElementById('songList').innerHTML = '<p class="text-red-500">楽曲データの読み込みに失敗しました。</p>';
            }
        }

        function updateLatest20() {
            playlists["最新20曲"] = [...allSongs].sort((a,b) => new Date(b.last_updated) - new Date(a.last_updated)).slice(0, 20);
            localStorage.setItem('myPlaylists', JSON.stringify(playlists));
        }

        function renderList(targetPlaylist = "全楽曲") {
            document.getElementById('listTitle').innerText = targetPlaylist;
            const list = document.getElementById('songList');
            let songs = (targetPlaylist === "全楽曲") ? [...allSongs].sort((a,b) => new Date(b.last_updated) - new Date(a.last_updated)) : (playlists[targetPlaylist] || []);
            
            list.innerHTML = songs.map((song) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex items-center gap-4">
                    <button onclick="loadAndPlaySong('${song.url}', '${song.title}')" class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full font-bold">▶</button>
                    <div class="flex-grow cursor-pointer" onclick="showDetail('${song.id}')">
                        <h2 class="font-bold">${song.title}</h2>
                        <p class="text-xs text-gray-500">${song.artist}</p>
                    </div>
                </div>
            `).join('');
            showScreen('listScreen');
        }

        function showDetail(songId) {
            const song = allSongs.find(s => s.id === songId);
            const fileName = song.url.split('/').pop().replace('.wav', '');
            const version = fileName.split('_').pop();
            const currentListNames = Object.keys(playlists).filter(name => playlists[name].find(s => s.id === song.id));

            document.getElementById('playerContent').innerHTML = `
                <div class="space-y-4 text-left">
                    <h2 class="text-2xl font-bold text-center">${song.title}</h2>
                    <p class="text-gray-500 text-center mb-4">${song.artist}</p>
                    <button onclick="loadAndPlaySong('${song.url}', '${song.title}')" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold mb-4">再生する</button>
                    <div class="bg-gray-50 p-4 rounded-lg space-y-2 text-sm">
                        <p><b>歌い直し:</b> ${song.is_retake ? 'はい' : 'いいえ'}</p>
                        <p><b>バージョン:</b> ${version}</p>
                        <p><b>所属リスト:</b> ${currentListNames.map(name => `<button onclick="renderList('${name}')" class="text-blue-600 underline">${name}</button>`).join(', ') || 'なし'}</p>
                    </div>
                    <select id="playlistSelect" class="w-full p-2 border rounded mt-4">
                        ${Object.keys(playlists).map(n => `<option value="${n}">${n}</option>`).join('')}
                    </select>
                    <button onclick="addToPlaylist('${song.id}')" class="w-full py-2 bg-gray-800 text-white rounded font-bold">リストに追加</button>
                </div>
            `;
            showScreen('playerScreen');
        }

        function renderPlaylists() {
            const list = document.getElementById('playlistList');
            list.innerHTML = Object.keys(playlists).map(name => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
                    <button onclick="renderList('${name}')" class="font-bold">${name}</button>
                    ${name !== "最新20曲" && name !== "お気に入り" ? `<button onclick="deletePlaylist('${name}')" class="text-red-500 text-xs">削除</button>` : ''}
                </div>
            `).join('');
        }

        function createPlaylist() {
            const name = document.getElementById('newPlaylistName').value;
            if(name && !playlists[name]) {
                playlists[name] = [];
                localStorage.setItem('myPlaylists', JSON.stringify(playlists));
                renderPlaylists();
            }
        }

        function deletePlaylist(name) {
            delete playlists[name];
            localStorage.setItem('myPlaylists', JSON.stringify(playlists));
            renderPlaylists();
        }

        function addToPlaylist(songId) {
            const name = document.getElementById('playlistSelect').value;
            const song = allSongs.find(s => s.id === songId);
            if(!playlists[name].find(s => s.id === songId)) {
                playlists[name].push(song);
                localStorage.setItem('myPlaylists', JSON.stringify(playlists));
                alert('追加しました');
            }
        }

        function showScreen(id) {
            ['listScreen', 'playlistScreen', 'playerScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'playlistScreen') renderPlaylists();
        }

        function loadAndPlaySong(url, title) {
            audioPlayer.src = url;
            audioPlayer.play();
            document.getElementById('miniPlayer').classList.remove('hidden');
            document.getElementById('miniTitle').innerText = title;
        }

        function togglePlay() {
            audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
        }
    </script>
</body>
</html>
