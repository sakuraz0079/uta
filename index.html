<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE MOBILE</title>
    <!-- 便利なデザインフレームワークTailwind CSSを読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
    
    <div class="max-w-md mx-auto p-4">
        <!-- タイトルエリア -->
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">UTA-ARCHIVE</h1>
        
        <!-- 検索入力エリア -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="曲名やアーティストで検索..." 
                   class="w-full p-4 rounded-xl border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all">
        </div>

        <!-- 楽曲リスト表示エリア -->
        <div id="songList" class="space-y-4">
            <!-- JavaScriptによってここへデータが書き込まれます -->
            <p class="text-center text-gray-500">楽曲データを読み込んでいます...</p>
        </div>
    </div>

    <!-- type="module" を追加してJavaScriptモジュールとして読み込むように修正 -->
    <script src="script.js"></script>
</body>
</html>
