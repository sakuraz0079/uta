<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-48">
    <div class="max-w-md mx-auto p-4">
        <nav class="flex gap-4 mb-6 text-sm font-bold text-gray-500 overflow-x-auto pb-2 border-b">
            <button onclick="showScreen('listScreen')" class="whitespace-nowrap text-blue-600">全楽曲</button>
            <button onclick="showPlaylist()" class="whitespace-nowrap">再生リスト</button>
        </nav>

        <div id="listScreen">
            <h1 class="text-2xl font-extrabold mb-4">全楽曲</h1>
            <input type="text" id="searchInput" placeholder="曲名やアーティストで検索..." oninput="resetPageAndFilter()" class="w-full p-3 mb-4 border rounded-xl shadow-sm">
            <div id="songList" class="space-y-3">読み込み中...</div>
            <div id="moreContainer" class="mt-6 hidden">
                <button onclick="loadMore()" class="w-full py-3 bg-gray-200 text-gray-700 rounded-xl font-bold">さらに読み込む</button>
            </div>
        </div>

        <div id="playlistScreen" class="hidden">
            <h1 class="text-2xl font-extrabold mb-4">再生リスト</h1>
            <div id="playlistContainer" class="space-y-4"></div>
        </div>

        <div id="playerScreen" class="hidden">
            <button onclick="showScreen('listScreen')" class="mb-4 text-blue-600 font-bold">&larr; リストに戻る</button>
            <div id="playerContent" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100"></div>
        </div>
    </div>

    <!-- 常時表示の再生ゾーン -->
    <div id="persistentPlayer" class="fixed bottom-0 left-0 w-full bg-white border-t p-4 shadow-2xl z-50">
        <div class="max-w-md mx-auto">
            <div id="miniInfo" class="text-xs mb-2 truncate font-bold text-gray-600">未再生</div>
            <canvas id="waveform" class="w-full h-16 bg-gray-100 rounded-lg mb-3 cursor-pointer"></canvas>
            <div class="flex justify-between text-[10px] text-gray-400 mb-2">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="flex justify-between items-center text-2xl">
                <button onclick="toggleRepeat()" id="repeatBtn" class="text-gray-400">↺</button>
                <button onclick="prevSong()" class="text-gray-800">⏮</button>
                <button onclick="togglePlayPause()" id="mainPlayBtn" class="bg-blue-600 text-white w-12 h-12 rounded-full text-center">▶</button>
                <button onclick="nextSong()" class="text-gray-800">⏭</button>
                <button onclick="toggleShuffle()" id="shuffleBtn" class="text-gray-400">🔀</button>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let filteredSongs = [];
        let displayCount = 20;
        let playlist = JSON.parse(localStorage.getItem('myPlaylist')) || [];
        let isShuffle = false;
        let repeatMode = 0;
        const audio = new Audio();
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');

        async function loadData() {
            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbzyZp7_HO5TsYlREel12IxcPXpEBL6zydkhe0jGFH_VDkvAlip22p0EpFUdpNLSQaWiWg/exec");
                allSongs = await response.json();
                allSongs.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
                filteredSongs = allSongs;
                renderList();
            } catch (e) { document.getElementById('songList').innerText = "読み込み失敗"; }
        }

        function renderList() {
            const container = document.getElementById('songList');
            container.innerHTML = filteredSongs.slice(0, displayCount).map(s => {
                const count = parseInt(s.retake_count) || 0;
                const stars = s.quality_score ? '★'.repeat(Math.min(s.quality_score, 5)) : '';
                return `
                <div class="bg-white p-4 rounded-xl border flex items-center gap-4">
                    <div class="text-blue-600 cursor-pointer" onclick="playSong('${s.url}', '${s.title}', '${s.artist}')">▶</div>
                    <div class="flex-grow cursor-pointer" onclick="showDetail('${s.id}')">
                        <div class="flex items-center gap-2">
                            <h2 class="font-bold text-sm truncate">${s.title}</h2>
                            ${count > 0 ? `<span class="text-[10px] bg-red-100 text-red-600 px-1 rounded font-bold">RE:${count}</span>` : ''}
                        </div>
                        <p class="text-[10px] text-gray-500">${s.artist}</p>
                        <div class="text-[10px] text-yellow-500">${stars}</div>
                    </div>
                </div>
            `}).join('');
        }

        function playSong(url, title, artist) {
            audio.src = url;
            document.getElementById('miniInfo').innerText = `${title} - ${artist}`;
            audio.play();
            document.getElementById('mainPlayBtn').innerText = '⏸';
        }

        function togglePlayPause() {
            if (audio.paused) { audio.play(); document.getElementById('mainPlayBtn').innerText = '⏸'; }
            else { audio.pause(); document.getElementById('mainPlayBtn').innerText = '▶'; }
        }

        function showDetail(id) {
            const s = allSongs.find(song => song.id == id);
            const stars = s.quality_score ? '★'.repeat(Math.min(s.quality_score, 5)) : '';
            document.getElementById('playerContent').innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-extrabold mb-1">${s.title}</h2>
                    <p class="text-lg text-gray-600">${s.artist}</p>
                    <div class="text-yellow-500 text-2xl my-2">${stars}</div>
                    <button onclick="playSong('${s.url}', '${s.title}', '${s.artist}')" class="w-full mt-4 py-4 bg-blue-600 text-white rounded-xl font-bold text-lg shadow-lg">再生ボタン ▶</button>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl space-y-3">
                    <div class="grid grid-cols-2 gap-4">
                        <div><p class="text-[10px] text-gray-400 font-bold">最高音</p><p class="font-bold">${s.highest_note || '-'}</p></div>
                        <div><p class="text-[10px] text-gray-400 font-bold">キー</p><p class="font-bold">${s.key || '-'}</p></div>
                    </div>
                    <p class="text-sm pt-2 border-t">${s.memo || 'メモなし'}</p>
                </div>
            `;
            showScreen('playerScreen');
        }

        audio.ontimeupdate = () => {
            const progress = audio.currentTime / audio.duration || 0;
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration || 0);
            drawWaveform(progress);
        };

        function drawWaveform(p) {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#e5e7eb";
            for(let i=0; i<40; i++) ctx.fillRect(i*10, 10, 5, Math.random()*40);
            ctx.fillStyle = "#2563eb";
            ctx.fillRect(0,0,canvas.width * p, canvas.height);
        }

        function formatTime(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }
        function showScreen(id) { ['listScreen','playlistScreen','playerScreen'].forEach(s => document.getElementById(s).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function resetPageAndFilter() { displayCount = 20; const kw = document.getElementById('searchInput').value.toLowerCase(); filteredSongs = allSongs.filter(s => s.title.toLowerCase().includes(kw)); renderList(); }
        function loadMore() { displayCount += 20; renderList(); }
        function toggleRepeat() { repeatMode = (repeatMode+1)%3; document.getElementById('repeatBtn').style.color = repeatMode ? 'blue' : '#9ca3af'; }
        function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('shuffleBtn').style.color = isShuffle ? 'blue' : '#9ca3af'; }
        function prevSong() {} function nextSong() {} function showPlaylist() { showScreen('playlistScreen'); }

        loadData();
    </script>
</body>
</html>
