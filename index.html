<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA-ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-24">
    <div class="max-w-md mx-auto p-4">
        <!-- ナビゲーション -->
        <nav class="flex gap-4 mb-6 text-sm font-bold text-gray-500">
            <button onclick="showScreen('listScreen')" class="active:text-blue-600">全楽曲</button>
            <button onclick="showPlaylist()" class="active:text-blue-600">再生リスト</button>
        </nav>

        <!-- 楽曲リスト画面 -->
        <div id="listScreen">
            <h1 class="text-2xl font-extrabold mb-4">全楽曲</h1>
            <div id="songList" class="space-y-3">読み込み中...</div>
        </div>

        <!-- 再生リスト画面 -->
        <div id="playlistScreen" class="hidden">
            <h1 class="text-2xl font-extrabold mb-4">再生リスト</h1>
            <div id="playlistContent" class="space-y-3"></div>
        </div>

        <!-- プレイヤー詳細画面 -->
        <div id="playerScreen" class="hidden">
            <button onclick="showScreen('listScreen')" class="mb-4 text-blue-600 font-bold">&larr; 戻る</button>
            <div id="playerContent" class="bg-white p-8 rounded-3xl shadow-lg text-center"></div>
        </div>

        <!-- ミニプレイヤー -->
        <div id="miniPlayer" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-2xl z-50">
            <p id="miniTitle" class="text-sm font-bold mb-2 truncate text-center"></p>
            <div class="flex justify-center items-center gap-6 text-2xl">
                <button onclick="togglePlay()" id="mainPlayBtn" class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center">▶</button>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [], audioPlayer = new Audio();
        let playlist = JSON.parse(localStorage.getItem('myPlaylist')) || [];

        document.addEventListener('DOMContentLoaded', async () => {
            const response = await fetch('data.json');
            allSongs = await response.json();
            renderList();
        });

        function renderList() {
            const list = document.getElementById('songList');
            list.innerHTML = allSongs.map((song, i) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex items-center gap-4">
                    <button onclick="loadAndPlay(${i})" class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full font-bold">▶</button>
                    <div class="flex-grow cursor-pointer" onclick="showDetail(${i})">
                        <h2 class="font-bold">${song.title}</h2>
                        <p class="text-xs text-gray-500">${song.artist}</p>
                    </div>
                </div>
            `).join('');
        }

        function showDetail(index) {
            const song = allSongs[index];
            const version = song.url.split('/').pop().replace('.wav', '').split('_').pop();
            document.getElementById('playerContent').innerHTML = `
                <h2 class="text-xl font-bold">${song.title}</h2>
                <p class="text-gray-500 mb-4">${song.artist}</p>
                <div class="text-left text-sm bg-gray-50 p-4 rounded-lg space-y-1">
                    <p><b>Ver:</b> ${version}</p>
                    <p><b>最高音:</b> ${song.highest_note || '未登録'}</p>
                </div>
                <button onclick="addToPlaylist(${index})" class="mt-6 w-full py-3 bg-gray-800 text-white rounded-xl font-bold">再生リストに追加</button>
            `;
            showScreen('playerScreen');
        }

        function showPlaylist() {
            const content = document.getElementById('playlistContent');
            content.innerHTML = playlist.map((song, i) => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
                    <span>${song.title}</span>
                    <button onclick="loadAndPlayByUrl('${song.url}')" class="text-blue-600 font-bold">再生</button>
                </div>
            `).join('');
            showScreen('playlistScreen');
        }

        function addToPlaylist(index) {
            playlist.push(allSongs[index]);
            localStorage.setItem('myPlaylist', JSON.stringify(playlist));
            alert('追加しました');
        }

        function showScreen(id) {
            ['listScreen', 'playlistScreen', 'playerScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function loadAndPlay(index) {
            audioPlayer.src = allSongs[index].url;
            audioPlayer.play();
            document.getElementById('miniPlayer').classList.remove('hidden');
            document.getElementById('miniTitle').innerText = allSongs[index].title;
        }

        function loadAndPlayByUrl(url) {
            audioPlayer.src = url;
            audioPlayer.play();
        }

        function togglePlay() {
            audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
        }
    </script>
</body>
</html>
